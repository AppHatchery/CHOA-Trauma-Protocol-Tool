const REF={"tta": "<h4>Activation level upgrade</h4><p>An activation level may be upgraded at the discretion of the ED Physician or the Trauma Surgeon.</p><h4>How activation works</h4><ul class=\"il\"><li>Communication Center, the ED charge RN or the transfer center determines the need to activate the trauma team based on the pre-determined criteria. The trauma team at the accepting campus is paged at the level of response indicated by the criteria.</li><li>For all Trauma STAT activations, the Trauma Surgery Attending is notified using the number provided in Doc on Call.</li><li>Communication Center will page a trauma update when available, ideally when the patient's estimated time of arrival (ETA) is under 20 minutes.</li><li>The page will indicate, if available: trauma activation level; trauma triage criteria; patient age; mechanism of injury; patient source; estimated patient arrival time; transport mode; date, time and initials.</li><li>All trauma team members remain in the trauma room until the physician leader or designee indicates that their role is no longer needed.</li><li>The ED attending is the physician in charge of trauma patients until transfer of service has taken place. If trauma surgery is consulted, transfer of service may take place (1) to the Trauma Surgery Attending or Fellow once present, or (2) to the admitting service, upon arrival to the admitting unit.</li></ul><h4>Where trauma transfers are seen first</h4><ul class=\"il\"><li>Trauma transfers from a referring ED that meet any level of trauma team activation will be seen in the Children's ED initially. This sub-set of patients should not be made direct admissions to inpatient units.</li><li>Trauma transfers from referring hospital operating rooms (OR) or post anesthesia care units (PACU) can be seen initially in the Children's ED or direct admitted to the Children's pediatric intensive care unit (PICU). This decision is at the discretion of the trauma attending and no other location is acceptable for the initial point of care for these patients.</li><li>Trauma transfers already admitted to referring hospital inpatient units may be direct admits or routed to the Children's ED at the discretion of the trauma attending.</li></ul><h4>Team attendance by activation level</h4><p>X = member attends. ABM = Arthur M. Blank campus; SR = Scottish Rite campus. STAT: activate trauma page and call Trauma Surgery Attending. ALERT and EVALUATION: activate trauma page. * = when available.</p><div class=\"rt\"><table><tr><th>Team member</th><th>STAT ABM</th><th>STAT SR</th><th>ALERT ABM</th><th>ALERT SR</th><th>EVAL (both campuses)</th></tr><tr><td>Trauma Surgery Attending</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>ED Attending</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Pediatric Trauma Surgery Fellow</td><td>X</td><td>—</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Trauma APP or Surgery APP or Surgery Resident</td><td>X</td><td>X</td><td>X</td><td>X</td><td>When consulted</td></tr><tr><td>Anesthesia Service or airway control physician</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Respiratory Care</td><td>X</td><td>X</td><td>X</td><td>X</td><td>—</td></tr><tr><td>ED RN Team Lead RN</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>PICU RN</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>OR RN</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>ED RN</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Trauma RN *</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Paramedic/PCT</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Laboratory - Phlebotomist</td><td>X</td><td>X</td><td>X</td><td>X</td><td>—</td></tr><tr><td>Radiology Tech</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Security</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Child Life *</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr><tr><td>Pharmacy</td><td>X</td><td>X</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Social Work/Chaplain</td><td>X</td><td>X</td><td>X</td><td>X</td><td>X</td></tr></table></div><h4>Team member roles</h4><div class=\"rt\"><table><tr><th>Role</th><th>Responsibilities</th></tr><tr><td>ED Attending</td><td>Serves as medical control for EMS calls; Assumes team leader function until trauma surgeon attending/surgery fellow arrives; Initial primary/secondary survey (if trauma surgeon attending not present); Coordinates team activities; Performs or assists with interventions/procedures such as airway control</td></tr><tr><td>Trauma Surgeon (Attending/Fellow)</td><td>Upon arrival, becomes the leader of all team activities; Initial primary/secondary survey; Performs or assists with interventions/procedures; Directs resuscitation</td></tr><tr><td>Trauma APP / Surgery Resident / Surgery APP</td><td>Assists with surgical stabilization as directed by the attending physician</td></tr><tr><td>Airway control physician (may be Anesthesia, ED, Trauma or Critical Care Provider)</td><td>Establishes clear airway; Intubates; Obtains surgical airway if indicated; ED attending or Anesthesia dictates airway management in collaboration with Trauma physician</td></tr><tr><td>Respiratory Care</td><td>Assists with airway maintenance; Sets up and manages ventilator; Places airway monitoring devices; Monitors end tidal carbon dioxide (CO2) readings</td></tr><tr><td>Trauma RN (when on duty)</td><td>Responds to all trauma team activations (Trauma Stats, Trauma Alerts and Trauma Evaluations); Ensures adherence to Children's trauma quality indicators; Accompanies critical trauma patients to CT/PICU/OR as appropriate; Assists general surgery, neurosurgery, and/or orthopedic surgery with bedside procedures as directed by the physician; Serves as a clinical resource, encourages professional growth, and promotes evidence based medicine and best practices</td></tr><tr><td>Team lead RN (Pediatric Trauma Specialist when available)</td><td>Primary RN; Documents attending physician dictated primary/secondary survey, orders and trauma diagnostics; Completes all nursing documentation; Provides direct patient care as indicated</td></tr><tr><td>ED RN</td><td>Sets up trauma room; Assists with airway management; Assists with all procedures as needed; Obtains venous access and draws blood for labs; Provides warming measures; Maintains cardiorespiratory monitoring; Administers medications; Communicates nursing reassessments to the recorder: breath sounds and heart tones; assists in monitoring end tidal CO2 readings; pulses and capillary refill; neuro checks; bowel sounds/abdominal reassessment; neurovascular checks; accompanies the unstable patient outside the ED (CT, ICU, OR)</td></tr><tr><td>ED Paramedic / ED Technician</td><td>Sets up cardiorespiratory monitor – correct size setup (neonate, pediatrics, adult) and attachments (cuffs, pulse-ox probe, leads); Point of care (POC) testing at bedside; Places monitor leads and blood pressure (BP) cuff on patient; takes temperature; Sets up defibrillator with appropriate multifunction pads (Paramedic only); Sets up Bair Hugger; sets up IV pump with warmed fluids; Exposes patient; Assures patient is on backboard if cardiopulmonary resuscitation (CPR) is needed; performs chest compressions; Circulates in room and pulls additional supplies as needed; Accompanies unstable patient outside the ED; assists with patient transport as directed</td></tr><tr><td>Laboratory</td><td>Phlebotomist draws blood as needed and transports specimens to lab</td></tr><tr><td>Radiology tech</td><td>Performs ordered diagnostic x-rays</td></tr><tr><td>Security</td><td>Crowd control; Expedites patient transport</td></tr><tr><td>Child Life</td><td>Utilizes distraction therapy as indicated for patient comfort; Serves as liaison with patient's siblings and family</td></tr><tr><td>Pharmacy</td><td>Responds to all Trauma Stats; Dispenses ordered medications ready for administration</td></tr><tr><td>Social Work/Chaplain</td><td>Serves as liaison with patient's family and friends</td></tr></table></div>", "mtp": "<h4>Contact for massive transfusion support questions</h4><p>Contact the Transfusion Medicine Resident On Call: 404-686-5500, enter Pager ID #: 50435#.</p><h4>Blood Bank (Transfusion Services) responsibilities (process H)</h4><ul class=\"il\"><li>For non-ED patients, provide the first MTP in a cooler with RBCs and plasma in a 1:1 ratio based on the patient's weight class and the internal weight based transfusion volume algorithm (see weight-based package table below).</li><li>If the patient has an active (&lt; 72 hour) type/screen collected by collection manager OR has a historical confirmatory blood type in the system, type-compatible products are used in all packages as available.</li><li>If the patient has an inactive type/screen, it should be performed as soon as a specimen is available (preferably before release of package 2). All future products will be type compatible and crossmatch compatible if possible.</li><li>Rh-negative males receive Rh (D) positive platelets in cases of supply shortage; Rh-negative females should receive Rh (D) positive platelets only as a last resort. The blood bank provider on call should be notified by the Blood Bank if Rh-positive products are to be given to Rh-negative females.</li><li>For each subsequent MTP package, RBCs and plasma are given out in a cooler. Platelets and cryoprecipitate are given out at room temperature and should NOT be placed in the cooler at any time.</li></ul><h4>BloodTrack screen steps (ED only)</h4><ul class=\"il\"><li>Section 1, log in: scan or enter your employee user ID barcode, type your password and touch OK. If the barcode is unavailable, touch Manual login, type your employee number, touch Login, enter your PIN (CHOA network password), then touch OK.</li><li>Section 2, select the MTP pack: touch the row \"Touch here for MTP Packs\" and select the appropriate MTP pack based on the patient weight.</li><li>Section 3, enter patient information: the scanner is under the monitor. Scan the patient HAR label. Only the HAR number displays. Touch YES to confirm patient identification.</li><li>Section 4, retrieve blood products (RBC and FFP): a tray illuminates blue — open the fridge door, open the tray, take the unit out, close the tray. The system says \"Scan the unit number\" (it may also ask to scan the product code). The system says \"Inspect the unit\": if acceptable touch YES; if not acceptable touch NO and follow the system instructions. The system approves the transaction and a second drawer illuminates blue; repeat the section 4 steps for each unit. When all units are delivered, the system displays \"You have successfully taken out all the units for the selected MTP pack number\"; touch OK and close the refrigerator door.</li><li>Section 5, cooler: place all units (RBC and FFP) in the cooler (see Policy 7.02 for issuing and storage of blood products). Bring the cooler with units inside to the bedside of the patient. Unused products must be returned to the Blood Bank in a timely fashion.</li></ul><h4>Weight-based MTP package overview</h4><h4>NEONATE, weight 0–5.9 kg</h4><div class=\"rt\"><table><tr><th>Package</th><th>Cryo</th><th>RBC</th><th>Plasma</th><th>Platelet</th></tr><tr><td>1</td><td>—</td><td>½ Unit</td><td>½ Unit</td><td>—</td></tr><tr><td>2</td><td>1 Unit</td><td>½ Unit</td><td>½ Unit</td><td>¼ Apheresis</td></tr><tr><td>3</td><td>—</td><td>½ Unit</td><td>½ Unit</td><td>—</td></tr><tr><td>4</td><td>1 Unit</td><td>½ Unit</td><td>½ Unit</td><td>¼ Apheresis</td></tr><tr><td>5</td><td>—</td><td>½ Unit</td><td>½ Unit</td><td>—</td></tr></table></div><h4>INFANT, weight 6–9.9 kg</h4><div class=\"rt\"><table><tr><th>Package</th><th>Cryo</th><th>RBC</th><th>Plasma</th><th>Platelet</th></tr><tr><td>1</td><td>—</td><td>1 Unit</td><td>1 Unit</td><td>—</td></tr><tr><td>2</td><td>2 Units</td><td>1 Unit</td><td>1 Unit</td><td>½ Apheresis</td></tr><tr><td>3</td><td>—</td><td>1 Unit</td><td>1 Unit</td><td>—</td></tr><tr><td>4</td><td>2 Units</td><td>1 Unit</td><td>1 Unit</td><td>½ Apheresis</td></tr><tr><td>5</td><td>—</td><td>1 Unit</td><td>1 Unit</td><td>—</td></tr></table></div><h4>YOUNGER CHILD, weight 10–25.9 kg</h4><div class=\"rt\"><table><tr><th>Package</th><th>Cryo</th><th>RBC</th><th>Plasma</th><th>Platelet</th></tr><tr><td>1</td><td>—</td><td>2 Units</td><td>2 Units</td><td>—</td></tr><tr><td>2</td><td>4 Units</td><td>2 Units</td><td>2 Units</td><td>1 Apheresis</td></tr><tr><td>3</td><td>—</td><td>2 Units</td><td>2 Units</td><td>—</td></tr><tr><td>4</td><td>4 Units</td><td>2 Units</td><td>2 Units</td><td>1 Apheresis</td></tr><tr><td>5</td><td>—</td><td>2 Units</td><td>2 Units</td><td>—</td></tr></table></div><h4>OLDER CHILD, weight 26–49.9 kg</h4><div class=\"rt\"><table><tr><th>Package</th><th>Cryo</th><th>RBC</th><th>Plasma</th><th>Platelet</th></tr><tr><td>1</td><td>—</td><td>3 Units</td><td>3 Units</td><td>—</td></tr><tr><td>2</td><td>6 Units</td><td>3 Units</td><td>3 Units</td><td>1 Apheresis</td></tr><tr><td>3</td><td>—</td><td>3 Units</td><td>3 Units</td><td>—</td></tr><tr><td>4</td><td>6 Units</td><td>3 Units</td><td>3 Units</td><td>1 Apheresis</td></tr><tr><td>5</td><td>—</td><td>3 Units</td><td>3 Units</td><td>—</td></tr></table></div><h4>ADOLESCENT, weight &gt; 50 kg</h4><div class=\"rt\"><table><tr><th>Package</th><th>Cryo</th><th>RBC</th><th>Plasma</th><th>Platelet</th></tr><tr><td>1</td><td>—</td><td>5 Units</td><td>5 Units</td><td>—</td></tr><tr><td>2</td><td>8 Units</td><td>5 Units</td><td>5 Units</td><td>1 Apheresis</td></tr><tr><td>3</td><td>—</td><td>5 Units</td><td>5 Units</td><td>—</td></tr><tr><td>4</td><td>8 Units</td><td>5 Units</td><td>5 Units</td><td>1 Apheresis</td></tr><tr><td>5</td><td>—</td><td>5 Units</td><td>5 Units</td><td>—</td></tr></table></div><p>Cryo and platelets are given only with packages 2 and 4. RBC and plasma are given in a 1:1 ratio in every package.</p><h4>Additional details from the guideline</h4><ul class=\"il\"><li>The policy states a near 1:1 replacement ratio of pRBCs to plasma as the goal of MTP.</li></ul>", "bat": "<h4>¹ Trauma labs and imaging (per provider discretion based on patient condition)</h4><ul class=\"il\"><li>Basic Trauma Panel: CXR; urinalysis; CBC; CMP; lipase</li><li>Extended Trauma Panel: CXR; urinalysis; CBC; CMP; lipase; PT/PTT; for BAT patients add pelvic films and ensure type and screen has been obtained</li></ul><h4>² Consult Trauma Surgery</h4><ul class=\"il\"><li>All Trauma STATs and Alerts (per Trauma Team Activation policy); escalate to Trauma STAT if the patient is hemodynamically unstable</li><li>When ordering a CT scan of the abdomen</li><li>Immediately with a positive CT scan result</li><li>For admission to the Trauma service</li></ul><h4>³ Admission criteria</h4><ul class=\"il\"><li>Present seatbelt sign</li><li>Uncontrolled pain</li><li>Not tolerating PO</li><li>Altered mental status (from baseline)</li><li>Inability to ambulate</li><li>Trauma Team to review lab results and have a plan of care for the patient prior to admission/transfer to floor</li></ul><h4>⁴ Discharge criteria</h4><ul class=\"il\"><li>Asymptomatic (pain adequately controlled)</li><li>Tolerating PO</li><li>Able to ambulate</li><li>Stable labs</li></ul><h4>ATOMAC protocol key principles</h4><ul class=\"il\"><li>Follow ATLS protocol first</li><li>Patients with peritonitis are managed per surgeon discretion and do not follow the algorithm</li><li>Polytrauma patients may follow the algorithm when not contraindicated</li><li>Continued bleeding: defined by the surgeon (i.e., inadequate Hb increase to transfusion, hemodynamic signs of hypovolemia +/- anemia)</li><li>Stable Hb: a Hb value not dropping more than 0.5 mg/dl in 12 hrs. Repeat Hb is optional</li><li>Any lab suspected to be erroneous may be repeated prior to medical decision-making</li><li>Times refer to time of injury</li><li>Late presentation: stable patients presenting within 48 hrs post injury are still admitted for 24 hrs of observation but Hb rechecks are optional. Injuries &gt; 48 hrs are at surgeon discretion</li><li>Reference: the ATOMAC Guideline</li></ul><h4>Discharge instructions (ATOMAC)</h4><ul class=\"il\"><li>No ibuprofen or other NSAIDs; acetaminophen okay</li><li>May return to school when off opioid pain meds</li><li>Restricted activity for length of (Grade + 2 = weeks) per ASPA Guidelines</li><li>Return to ED for increasing pain, pallor, dizziness, vomiting, worsening shoulder pain, GI bleeding or black tarry stools. Call office for jaundice</li><li>Grade 1-2: follow up phone call at 2 weeks and again at 2 months</li><li>Grade 3-5: office visit at 2 weeks and follow up phone call at 2 months</li><li>No follow-up imaging is required</li><li>Must follow up in clinic to be cleared for sports</li></ul>", "extremity": "<h4>Additional details from the guideline</h4><ul class=\"il\"><li>Tetanus prophylaxis is stated on the open fracture branch as: under 7 years old DTaP; 7 years and older Tdap.</li></ul>", "ir": "<h4>Resource phone numbers</h4><ul class=\"il\"><li>EG ED Charge Nurse: X 5-0311</li><li>EG ED Trauma Nurse: use Voalte Role</li><li>SR ED Charge Nurse: X 5-4938</li><li>SR ED Trauma Nurse: use Voalte Role</li></ul><h4>Responsibilities of the ED Trauma Nurse in IR</h4><p>Assist Anesthesia with:</p><ul class=\"il\"><li>Retrieval of equipment, supplies, medications, fluid, blood</li><li>Patient positioning</li><li>Airway management</li><li>Emergency procedures</li></ul><p>The resource nurse will not be required to take orders or document in the IR suite.</p><h4>Transfer of care</h4><p>SBAR: upon nurse return to the ED, or upon completion of the IR procedure, and to be given to the ICU/OR nurse.</p><h4>After hours for IR trauma</h4><ul class=\"il\"><li>6:30p to 7a weekdays</li><li>24-hour coverage weekends</li></ul>", "open_fx": "<h4>Additional details from the guideline</h4><ul class=\"il\"><li>The dosing table says: if cephalosporin allergy, penicillin-allergic patients can still receive cefazolin. For cephalexin, \"if PCN allergic, use clindamycin.\"</li></ul>", "vte": "<h4>Pharmacologic prophylaxis</h4><p>Enoxaparin</p><ul class=\"il\"><li>Patients &lt; 2 months: 0.75 mg/kg subcutaneous BID, max dose 30 mg</li><li>Patients ≥ 2 months: 0.5 mg/kg subcutaneous BID, max dose 30 mg</li><li>Patients &gt; 60 kg: 40 mg subcutaneous Daily OR 30 mg subcutaneous BID</li><li>Patients &gt; 60 kg AND BMI &gt; 99 percentile: 40 mg subcutaneously BID</li></ul><p>Unfractionated heparin</p><ul class=\"il\"><li>Patients &lt; 1 year: 20 units/kg/hr IV</li><li>Patients ≥ 1 year: 10 units/kg/hr IV</li></ul><p>Continue enoxaparin until the patient can ambulate 150 feet, at baseline mobility, and/or risk factors are resolved.</p><h4>Contraindications to pharmacologic prophylaxis</h4><ul class=\"il\"><li>Ongoing or uncontrolled bleeding</li><li>Uncorrected coagulopathy (PLT &lt; 50,000; fibrinogen &lt; 100; INR &gt; 1.5; or PTT &gt; 2x control)</li><li>Acute arterial ischemic stroke</li><li>Suspected or known intracranial, intraspinal, or paraspinal hematoma</li><li>Major allergy to pork products (LMWH only)</li><li>History of heparin induced thrombocytopenia</li><li>Intracranial monitoring (EVD/Bolt)</li><li>CNS drain (epidural catheter/other)</li><li>Risk for major surgical bleeding within 24-48 hrs</li><li>Family/personal history of bleeding disorder</li><li>Invasive procedure within 24 hours</li></ul><p>Obtain clearance from Neurosurgery to start pharmacologic prophylaxis in patients with spinal or cranial hemorrhage.</p><h4>Monitoring</h4><ul class=\"il\"><li>Monitor heparin assay if Cr clearance &lt; 30 mL/min</li><li>Consider monitoring heparin assay if: Cr clearance &lt; 60 mL/min OR the patient is &lt; 12 months and UOP is &lt; 1 mL/kg/hr</li><li>Heparin assay for LMWH should be 0.2-0.5</li></ul><p>Consider consulting pharmacy or hematology.</p>", "sbirt": "<h4>CRAFFT questions</h4><ul class=\"il\"><li>C — Have you ever ridden in a CAR driven by someone (including yourself) who was \"high\" or had been using alcohol or drugs?</li><li>R — Do you ever use alcohol or drugs to RELAX, feel better about yourself, or fit in?</li><li>A — Do you ever use alcohol/drugs while you are by yourself, ALONE?</li><li>F — Do you ever FORGET things you did while using alcohol or drugs?</li><li>F — Do your family or FRIENDS ever tell you that you should cut down on your drinking or drug use?</li><li>T — Have you gotten into TROUBLE while you were using alcohol or drugs?</li></ul><p>Each \"yes\" answer is one point. A score of two or more indicates the need for further assessment, and Psychiatry should be consulted for the patient.</p><h4>Confidentiality</h4><ul class=\"il\"><li>Information regarding substance use and/or abuse is treated as confidential medical information.</li><li>Results of alcohol and drug testing can be shared with parents or guardians of minor patients without their consent unless the patient is actively \"seeking\" treatment and articulates that he/she does not want the information shared.</li><li>In that case, the information can still be shared with the parents/guardians when: (1) testing was done for medical purposes; (2) the patient is extremely young and/or lacks the capacity for rational choice; or (3) the situation poses a substantial threat to life or physical well-being.</li></ul><h4>Documentation and communication</h4><ul class=\"il\"><li>Document the patient's answers to the CRAFFT Tool in the EPIC template \"SBIRT\".</li><li>Document notification by Trauma Services to psychiatry of a positive screen.</li><li>Document the Brief Intervention administered; referral to psychiatry; referral completed and documented by psychiatry.</li><li>Document a decision by the patient and/or parent not to participate in the CRAFFT screening or the Brief Intervention.</li><li>Document any other interactions with the patient and/or parent regarding the screening and/or clinical response by the hospital health care team.</li><li>Information regarding the Brief Intervention should be communicated to the patient's health care team as appropriate for continuity of care.</li></ul><h4>Definitions</h4><ul class=\"il\"><li>Screening: a procedure to recognize individuals with a disorder before obvious manifestations have occurred; the goal is early recognition, while interventions or treatments are most effective.</li><li>Brief Intervention: techniques/practices that aim to investigate a potential problem and motivate an individual to begin to do something about his/her substance abuse, by patient-directed means or by seeking additional treatment. It usually happens in a single session immediately following a positive screening result and focuses on increasing the patient's understanding of the impact of substance use on health and motivating change. If the patient shows signs of substance dependence or other complications, the provider can refer the patient to a certified youth chemical dependency treatment organization.</li><li>CRAFFT Tool: a validated tool used to screen adolescents for substance-related problems and disorders.</li></ul><h4>Patient and parent handouts (summary)</h4><ul class=\"il\"><li>The adolescent handout says: all injured patients 12 years or older are asked about alcohol and drugs; a trauma clinician asks the CRAFFT questions and answers go in the medical record; information is confidential, but if immediate safety is at risk the team will talk with parents or guardian, after discussing concerning answers with the patient first; the parent gets a fact sheet; anyone in the room is asked to step outside, though a parent has the right to remain present; a special nurse asks \"yes or no\" questions; a nurse practitioner or doctor may come to discuss the answers.</li><li>The parent handout says: the team asks to speak with the child in private so the conversation is honest; if the child's immediate safety is at risk the team will discuss concerns with the parent; answers are documented and reviewed by the healthcare team; a brief intervention is a discussion with a qualified healthcare professional meant to increase the child's understanding of the impact of substance use on health; other resources are suggested if needed.</li><li>Spanish versions of both handouts are included in the source policy.</li></ul><h4>Related policies</h4><p>Toxicology Screens (Trauma Policy and Procedure Manual) and Consent Policy (Administrative Policy Manual).</p>", "csec": "<h4>Short Screen for Child Sex Trafficking</h4><p>Before starting: build rapport. Say that you routinely ask these questions of adolescents to find out whether they may need help. Emphasize that the child does not have to answer. Remind them of the limits of confidentiality (you cannot guarantee that caregivers or others won't eventually see the chart; you are obliged to tell authorities if the child reveals possible abuse or thoughts/actions related to hurting themselves or others). Consider a chaperone in the room, as a shared decision between provider and child. For each \"Yes,\" follow up with questions about details.</p><ul class=\"il\"><li>1. Have you ever broken any bones, been knocked unconscious or had any injuries that required stitches? (If yes, \"Can you tell me about those times?\" — determine if abuse, peer violence, dating violence, or CSEC)</li><li>2. Some kids have a hard time living at home and feel that they need to run away. Have you ever run away from home? (If yes: stayed out all night or longer? how many times? longest time gone? how did you get money for food? where did you stay?)</li><li>3. Kids often use drugs or drink alcohol these days. Do you use drugs or drink alcohol? (follow up with frequency, type of drug, reason for using)</li><li>4. Sometimes kids have run-ins with police. Have you ever had any problems with the police? Do you feel comfortable telling me about them?</li><li>5. Have you been sexually active in the past (oral, vaginal or anal sex)? If yes, ask: \"Have you had more than 5 sexual partners?\"</li><li>6. Have you ever had any sexually transmitted diseases? Yes/No.</li></ul><p>If the child answered YES to 2 or more questions, ask:</p><ul class=\"il\"><li>1) Has a boyfriend, a girlfriend or anyone else ever asked you, or forced you to have sex with them or another person?</li><li>2) Have you ever had to exchange sex for money, food, shelter or something else you wanted? (Kids sometimes feel they have no option except to exchange sex or a sex activity for money, drugs, food or a place to stay.)</li></ul><p>If \"YES\" to either question, ask for details to determine if the child is a potential victim of CSEC.</p><h4>Potential indicators of child commercial sexual exploitation</h4><ul class=\"il\"><li>Initial clinical presentation, presents for evaluation of: acute sexual assault; suicide attempt; serious injury (other than MVC); drug/alcohol intoxication; complication of pregnancy/abortion; vaginal or penile discharge/signs and symptoms of PID</li><li>Child is accompanied by an adult who is: domineering and speaks for the child; apparently intimidating/frightening to the child; not the guardian; multiple youth presenting for treatment</li><li>Child behavior: gives false or changing demographic/historical information (or unable to state where he/she is); appears very submissive, depressed and/or withdrawn</li><li>Historical factors: frequent drug use/misuse; history of sexual or physical abuse or neglect; history of running away (especially &gt; 3 times over the past year), throwaway status or homelessness; prior involvement with child protective services (especially history of foster care); prior involvement with the department of juvenile justice; truancy or doing poorly in school; history of multiple sexual partners, especially over a short period of time; multiple prior STIs and/or history of pregnancy (or fathering a baby); LGBTQ youth; child has an older boyfriend/girlfriend (&gt; 4 years older)</li><li>Physical exam: signs concerning for inflicted injury; tattoos, especially of a man's name or sexually provocative words, or gang insignia; child has a large amount of cash or expensive items incongruous with the remainder of appearance; child has keys to a motel room</li></ul><p>Throwaway status refers to a child being told to leave home or forbidden to return. LGBTQ = lesbian, gay, bisexual, transgender or questioning youth.</p><h4>Issues of confidentiality and assent</h4><ul class=\"il\"><li>Confidentiality cannot be guaranteed to the child; inform the child of the limits of confidentiality.</li><li>You are obligated to share information with others if the child discloses abuse, neglect or intent to harm themselves or others. Commercial sexual exploitation/trafficking is considered child abuse in Georgia and must be reported. Follow Policy 2.25, Child Abuse Management.</li><li>Obtain the child's assent for each step of the assessment if at all possible: medical history, exam, sexual assault evidence kit, STI/pregnancy/drug testing, and pregnancy/STI prophylaxis. If the child does not want an element and their safety or immediate health needs are not jeopardized by foregoing it, the child's wishes should be respected. The sexual assault kit should not be done against the child's wishes, even if law enforcement is eager to obtain it. The provider may carefully explain the need and encourage discussion of the reluctance, but the decision is the child's. Children often later assent once rapport and trust are built. For kit collection see Policy 2.31, Forensic Evidence Collection, Preservation, and Chain of Custody.</li></ul><h4>Obtaining a medical history: separating the child from the accompanying adult and ensuring safety</h4><ul class=\"il\"><li>If at all possible, and with the child's assent, interview the patient alone, without the accompanying parent, guardian or friend. This is especially important in possible CSEC because the companion may be a trafficker or someone working for the trafficker.</li><li>You cannot force the accompanying person to leave, but you can tell both child and companion that it is standard practice for the medical provider/social worker to obtain history from the child alone, and ask the companion to wait in the waiting room or another place well away from the child's room.</li><li>Keep the exam room door closed and staff not walking in and out.</li><li>Before beginning, assess the child's feelings about safety (e.g., \"Is it okay for you to be talking to me now?\").</li><li>If the child hesitates or indicates they don't feel safe, gently ask why and take steps to address the problem. Keep track of time and periodically ask whether they still feel okay talking with you.</li></ul><h4>Protocol for medical exam and evaluation</h4><p>With rare exceptions, the provider needs the child's assent for exam, testing and evidence kit. The exam and evaluation are typically conducted by a nurse practitioner or physician from the child protection team (see the Doc-on-Call schedule: \"Child Advocacy Outpatient Consults\" or \"Child Advocacy inpatient consults\"). If the child is at any Children's Ambulatory location, call the Transfer Center and ask to talk to the physician on call for Child Protection, who will determine where the child should go for the exam. If the child protection nurse practitioner is unavailable to come to the ED, the attending physician is available for consultation, and the physician on call for the child protection team can be reached via Doc-on-Call.</p><ul class=\"il\"><li>1. Consult with SW and attending to identify information already obtained.</li><li>2. Attempt to obtain information on the Child Health Questionnaire, as feasible and as time allows (after discussing limits of confidentiality and assuring that answering is optional). It is not necessary to ask all questions; tailor them to the child and circumstances.</li><li>3. With the child's assent, complete a general physical exam with documentation of: general health and nutritional status; injuries, old and recent; tattoos, brands, gang insignia, unusual clothing or appearance; anogenital exam with magnification and video/photo documentation; sexual assault evidence kit (last contact &lt; 72 hours for pre-adolescent, &lt; 120 hours for adolescents); STI testing of appropriate sites (GC culture throat; urine GC/Chlamydia/Trich NAAT; anal culture GC/Chlamydia; serum for HIV, RPR with reflex titer, HBV, HCV with pre-test HIV counseling; other testing as indicated, e.g., herpes culture); pregnancy testing; drug-facilitated sexual assault urine drug screen and standard urine drug screen if indicated and with patient assent if feasible; other diagnostic testing as indicated (e.g., suspected trauma or other infection).</li><li>4. Offer STI and pregnancy prophylaxis (see the prophylaxis pathway).</li><li>5. Consider HIV prophylaxis and discuss with the patient (see the prophylaxis pathway).</li><li>6. Social Work reports to authorities and to the DFCS Human Trafficking Hotline.</li></ul><h4>Reporting to authorities</h4><p>In Georgia, healthcare providers are mandated reporters of child abuse and neglect. Commercial sexual exploitation/sex trafficking is considered a form of child abuse. When providers have a reasonable suspicion that a child is a victim, they are mandated to contact authorities. At Children's, the social worker is the designated reporter. At least three referrals need to be made by social work:</p><ul class=\"il\"><li>1) DFCS Centralized Intake: 1-855-GA CHILD (1-855-422-4453)</li><li>2) Law enforcement (police or sheriff in the jurisdiction where trafficking/exploitation occurred, if known)</li><li>3) DFCS Human Trafficking Hotline: 1-844-END-CSEC (1-844-363-2732). This is separate from abuse reporting via DFCS centralized intake. Contact as soon as possible so they can begin finding safe housing after discharge and address other immediate issues, and begin their assessment of the child's comprehensive needs.</li><li>4) For transnational victims, contact U.S. Immigration and Customs Enforcement: 1-866-872-4973 (immediate assistance with victim support, legal advocacy and needs assessment).</li></ul><p>When a suspected victim is older than 18 years, CSEC/sex trafficking is considered a crime but does not require a mandated report to authorities. If the patient agrees, the provider may contact law enforcement (social work to make the referral), but should at any rate offer services. Adult resources:</p><ul class=\"il\"><li>Human Trafficking State Hotline: 1-866-END-HTGA (1-866-363-4842)</li><li>Out of Darkness: 404-719-4854 (rescue hotline)</li><li>Wellspring Living: 404-427-3100 (hotline)</li><li>Human trafficking National Hotline: 1-888-3737-888 (guidance to providers as well as victims; can help find services)</li><li>For transnational victims: U.S. Immigration and Customs Enforcement: 1-866-872-4973</li></ul><h4>Other referrals</h4><ul class=\"il\"><li>Psychiatric consult if there are immediate concerns of self-harm or harm to others</li><li>Follow-up at the CHOA Blank Center for Safe and Healthy Children in 2 weeks</li><li>Trauma-focused behavioral health assessment and therapy (consider referral to Zalik Center)</li><li>Primary care follow-up to include HPV vaccination if needed and periodic STI testing at the department of public health clinic, teen clinic, PCP or other primary care site</li><li>OB/GYN care</li><li>Family planning</li><li>Subspecialist if other medical issues are identified</li></ul><h4>Background and terminology</h4><ul class=\"il\"><li>Focus population: children ≥ 11 years, male or female (applies to but is not limited to this group). Target users: all Children's locations; physicians, APPs, nurses, social workers, case managers, interpreters, pharmacists, Child Protection Team members and other staff.</li><li>When children (under 18 years) are involved, there need not be demonstrable force, coercion or other means to count as trafficking; trafficking need not involve travel from one place to another. For this guideline, \"survival sex\" (sex acts in exchange for money, food, shelter or other basic necessities) is considered a form of CSEC. Domestic minor sex trafficking (DMST) involves CSEC of children who are U.S. citizens or legal residents exploited within U.S. territory.</li><li>The average age of entry for child victims is 12–16 years. Boys and girls are vulnerable; male victims tend to be unrecognized and under-reported. Victims rarely present with a chief complaint of \"human trafficking,\" many do not view themselves as victims, and some girls have been manipulated into thinking the trafficker is her \"boyfriend,\" so the provider must be attuned to high-risk circumstances.</li><li>The word \"trafficker\" is used for the person in control of a victim; patients may say \"pimp,\" and the two are used interchangeably by those \"in the life,\" but trafficker is the preferred term.</li></ul><ul class=\"il\"><li>Human trafficking is a major global health and human rights issue; one international study reported victims in 132 countries. The total number of victims is unknown, with estimates into the millions; in one global study up to 60% of victims were women and 27% were children. The female to male ratio is unknown because male victims tend to be unrecognized and under-reported. Some child victims have no prominent risk factors and may live in stable homes.</li><li>Victims may present with closed head injury, strangulation, fractures, abdominal/pelvic trauma, bruising, lacerations, burns, anogenital trauma, STIs, pregnancy, abortion complications, PTSD, depression, suicidality, panic attacks, drug ingestion/overdose/withdrawal, exacerbations of untreated chronic disease (diabetes mellitus, asthma, seizure disorder, bipolar disorder), malnutrition or dehydration. Many victims present at some point for medical care, often to emergency departments and clinics.</li><li>The HIV exposure algorithm in the prophylaxis pathway is from: CDC. Antiretroviral postexposure prophylaxis after sexual, injection-drug use, or other nonoccupational exposure to HIV in the United States. MMWR 2005; 54(RR-02):1.</li></ul><p>Glossary of common street terms</p><div class=\"rt\"><table><tr><th>Term</th><th>Meaning</th></tr><tr><td>Bottom</td><td>Manager/assistant to exploiter; usually female; supervises other victims in the \"family\" or \"stable\"</td></tr><tr><td>Circuit, Track, Runway, Stroll, Blade</td><td>A given area associated with prostitution (streets, cities, states, regions)</td></tr><tr><td>Daddy, Player</td><td>Exploiter, trafficker</td></tr><tr><td>Escort service</td><td>An organization that provides sexual services to buyers, often advertised on the internet, with appointments by phone; adolescent travels to the buyer (\"out-call\") or the buyer comes to the site of service (\"in-call\"); may include brothels, hotels, homes</td></tr><tr><td>Facilitators</td><td>Those who enable or support trafficking: hotels, taxi drivers, advertisers, websites, or other groups</td></tr><tr><td>Gorilla/Guerrilla pimp</td><td>Exploiter who controls mainly through violence</td></tr><tr><td>Head cut</td><td>Victim being beaten down by their trafficker/pimp</td></tr><tr><td>Ho line</td><td>Communication network used by pimps between cities/states/regions to buy/sell victims</td></tr><tr><td>Kiddie stroll</td><td>Area of prostitution involving victims younger than 16 years</td></tr><tr><td>The life, the game</td><td>Commercial sexual activities, typically involving prostitution</td></tr><tr><td>Lot lizard</td><td>Person being prostituted at a truck stop</td></tr><tr><td>Out of pocket</td><td>Victim not under control of a trafficker but working in a pimp-controlled area or disobeying a pimp's orders</td></tr><tr><td>Pay for play (P4P)</td><td>Paid sex, term often used by buyers</td></tr><tr><td>Pimp circle</td><td>Punishment for violation by the victim; several exploiters surround the victim and humiliate, verbally and/or physically abuse her</td></tr><tr><td>Seasoning</td><td>Process of preparing a victim for trafficking; breaking the victim's will through physical and sexual violence, psychological manipulation and abuse, deprivation, isolation, threats and intimidation</td></tr><tr><td>Turn out</td><td>The act of being forced into prostitution</td></tr><tr><td>Water sports, golden showers</td><td>Urinating on a trafficking victim during paid sexual activity</td></tr></table></div><h4>Additional details from the guideline</h4><ul class=\"il\"><li>The Urgent and Primary Care page has a stop sign: at any time, local law enforcement may be called if staff feels there is a flight risk or dangerous situation.</li></ul>", "nat": "<h4>¹ High risk injuries (full list)</h4><ul class=\"il\"><li>1. Skull/facial fracture in child &lt; 2 years or nonverbal child. If ALL low-risk criteria are met (Step 3 path), consult social work and consider discharge per ED Attending/Neurosurgery; if ALL criteria are NOT met, proceed with the NAT work up.</li><li>2. Long bone fracture in child &lt; 2 years of age or nonverbal child. If ALL low-risk criteria are met, consult social work and consider discharge per ED Attending/Orthopedics; if ALL criteria are NOT met, proceed with the NAT work up.</li><li>3. Intracranial injury in a child &lt; 2 years or nonverbal child at any age (exclude MVC)</li><li>4. Rib fracture in child &lt; 3 years or nonverbal child at any age</li><li>5. Patterned and/or symmetrical burns</li><li>6. Domestic violence in the home or presents as victim of domestic violence</li><li>7. Injuries as defined by TEN-4-FACESp: Torso/Ears/Neck (torso includes genitals) in children 4 years of age or younger; any bruising on infants &lt; 4 months; Frenulum/Angle of jaw/Cheeks/Eyelids/Subconjunctival/scleral hemorrhage; patterned bruising</li></ul><h4>\"Red Flag\" considerations</h4><p>Infants with non-accidental trauma often present with non-specific complaints, such as:</p><ul class=\"il\"><li>Irritability in infants &lt; 6 months without fever or other identifiable cause</li><li>BRUEs</li><li>Altered mental status</li><li>Unexplained respiratory distress</li><li>Unexplained vomiting</li><li>Bruising</li><li>Seizure &lt; 6 months</li></ul><h4>\"Red Flag\" populations may include</h4><ul class=\"il\"><li>Premature infant (&lt; 37 weeks)</li><li>Low birth weight/IUGR</li><li>Multiple gestation</li><li>Chronic medical condition</li><li>Failure to thrive (FTT)</li><li>Caregiver with stimulant or drug dependence</li></ul><h4>\"Red Flags\" in patient history may include</h4><ul class=\"il\"><li>No mechanism of injury OR changing mechanism of injury after learning test results/diagnosis</li><li>Mechanism inconsistent with physical and/or developmental capabilities</li><li>Injury as a result of inadequate supervision</li><li>Delay in seeking care</li><li>Prior ED visit with history of inflicted injury and/or DFCS involvement</li></ul><p>Multiple red flags may include multiple concerns this admission or single concerns during multiple admissions (review EPIC FYI).</p><h4>Additional orders/consults by injury or symptom</h4><p>Recommended labs do not need to be resulted prior to ED disposition.</p><div class=\"rt\"><table><tr><th>Injury/symptom</th><th>Recommended labs</th><th>Recommended inpatient consults</th></tr><tr><td>Head injury and/or altered mental status of unknown etiology or abusive head trauma</td><td>—</td><td>Neurology consult for seizure activity; Ophthalmology (abusive head trauma)</td></tr><tr><td>Bleeding/bruising</td><td>DIC; Von Willebrand profile; Factor 9; Consider CPK if extensive bruising</td><td>—</td></tr><tr><td>Bony injury (long bone fracture, multiple fractures, and/or crush injury)</td><td>Vit D 25 hydroxy (routine deficiency testing); Mg, Phos, PTH; Consider CPK if multiple fractures, crush injury, extensive bruising, diffuse myalgia</td><td>—</td></tr><tr><td>Blunt cardiac injury</td><td>EKG</td><td>—</td></tr><tr><td>Nasal/oropharyngeal injury without known mechanism</td><td>—</td><td>ENT</td></tr></table></div><h4>² TEN-4-FACESp</h4><p>TEN-4-FACESp is a bruising clinical decision rule for children &lt; 4 years of age. When is bruising concerning for abuse in children &lt; 4 years of age? If bruising in any of the three components (Regions, Infants, Patterns) is present without a reasonable explanation, strongly consider evaluating for child abuse and/or consulting with an expert in child abuse.</p><ul class=\"il\"><li>Regions (TEN, FACES): Torso, Ears, Neck; Frenulum, Angle of jaw, Cheeks (fleshy part), Eyelids, Subconjunctivae</li><li>Infants: 4 months and younger — any bruise, anywhere</li><li>Patterns: patterned bruising — bruises in specific patterns like slap, grab or loop marks</li></ul><p>Unexplained bruises in these areas most often result from physical assault. TEN-4-FACESp is not to diagnose abuse but to function as a screening tool to improve the recognition of potentially abused children with bruising who require further evaluation. TEN-4-FACESp was developed and validated by Dr. Mary Clyde Pierce and colleagues (Ann &amp; Robert H. Lurie Children's Hospital of Chicago) and is available for free download at luriechildrens.org/ten-4-facesp.</p>"};

function sendReport(){

function tobj(){return proto&&T[proto.id]?T[proto.id]:null;}

const KIND={esc:'esc',ok:'act',clr:'clr'};
const KICON={esc:'alert-triangle',act:'arrow-right',clr:'check',nxt:'chevron-right'};
function dest(nx){
  const e=ends()[nx];
  if(e)return{k:KIND[e.type]||'act',tag:e.tag};
  const n=nds()[nx];
  return{k:'nxt',tag:'Next: '+(n?n.k:'')};
}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function optBtn(o,isGate,locked){
  const d=dest(o.nx);
  return '<button class="ob '+d.k+'"'+(isGate?' data-g="1"':'')+(locked?' disabled':'')+' data-nx="'+esc(o.nx)+'" data-ans="'+esc(o.l)+'" onclick="pick(this.dataset.nx,this.dataset.ans)"><div class="ostr '+d.k+'" aria-hidden="true"></div><div class="obd">'+(d.k==='nxt'?'':'<span class="otg">'+ico(KICON[d.k],12)+'<span>'+d.tag+'</span></span>')+'<span class="olb">'+esc(o.l)+'</span></div></button>';
}
function reqOk(nd){return nd.checks.every(function(_,i){return (nd.optional||[]).indexOf(i)>-1||checkedItems.has(i);});}
function checkRow(txt,j,on,optional){
  return '<button class="tckr'+(on?' ckd':'')+'" onclick="toggleCheck('+j+')" aria-pressed="'+on+'"><div class="tcci" aria-hidden="true">'+ico('check',10)+'</div><span>'+txt+(optional?' <em class="opt-note">optional</em>':'')+'</span></button>';
}
const RC_DEFAULT={unit:'risk factor',noun:'factor',lowName:'Moderate risk',highName:'High risk',lowBadge:'MODERATE',highBadge:'HIGH RISK',noneBadge:'NONE SELECTED',suffix:'2 or more = High Risk',zeroLbl:'No factors selected — Continue (Moderate risk)'};
function riskState(nd){
  const rc=Object.assign({},RC_DEFAULT,nd.riskCalc);
  const count=rc.factors.filter(function(_,i){return checkedItems.has(i);}).length;
  const hi=count>=rc.threshold;
  const nx=hi?rc.nxHigh:rc.nxLow;
  const nm=hi?rc.highName:rc.lowName;
  const pl=count===1?'':'s';
  return{rc:rc,count:count,hi:hi,nx:nx,d:dest(nx),
    cls:count===0?'':hi?'high':'mod',
    badge:count===0?rc.noneBadge:hi?rc.highBadge:rc.lowBadge,
    desc:count+' '+rc.noun+pl+' selected · '+rc.suffix,
    ans:count+' '+rc.unit+pl+' — '+nm,
    lbl:count===0?rc.zeroLbl:'Continue — '+nm+' ('+count+' '+rc.noun+pl+')'};
}
function tierState(nd){
  let ix=0,count=0,top=-1;
  nd.tiers.forEach(function(t,ti){t.items.forEach(function(){if(checkedItems.has(ix)){count++;if(top<0)top=ti;}ix++;});});
  const t=top>=0?nd.tiers[top]:null;
  const nx=t?t.nx:nd.nxNone;
  return{count:count,nx:nx,d:dest(nx),cls:t?t.cls:'',badge:t?t.name.replace(/ criteria$/,'').toUpperCase():'NONE SELECTED',
    desc:count+' selected'+(t&&nd.tiers.length>1?' · highest level met':''),
    ans:t?(t.name.replace(/ criteria$/,'')+' — '+count+' selected'):'None selected',
    lbl:t?'Continue — '+t.name.replace(/ criteria$/,'')+' ('+count+' selected)':(nd.noneLbl||'None selected — continue')};
}
function embedH(e){
  return '<details class="emb" ontoggle="embOpen(this)" data-src="'+esc(e.url)+'"><summary>'+esc(e.title)+'</summary><p class="emn">'+esc(e.note)+'</p><a class="emlink" href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Open in MDCalc \u2197</a><div class="emfw"></div><p class="emn">If the calculator does not load here, use the Open in MDCalc link.</p></details>';
}
function embOpen(el){

}
function riskCtrHTML(st){

function riskBtn(st){

}

// ── TREE ──────────────────────────────────────────────────────────
function treeH(){
  const nd=nds()[nid];if(!nd)return'';
  const sn=hist.length+1;
  let inf=nd.info||'',ent='';const em=inf.match(/<details class="entryd">[\s\S]*?<\/details>/);if(em){ent=em[0];inf=inf.replace(em[0],'').trim();}
  let b=`<div class="tw"><div class="prg"><span class="stp">Step ${sn}</span></div><p class="tk">${nd.k}</p>${ent?`<div class="tif entb">${ent}</div>`:''}${nd.act?`<div class="tif actb"><p class="clmg">Do first:</p><p>${nd.act}</p></div>`:''}${nd.noq?'':`<h2 class="tq">${nd.q}</h2>`}`;
  if(inf)b+=`<div class="tif">${inf}</div>`;
  if(nd.cl){
    const met=clMet(nd);
    b+='<div class="tif clist"><p class="clh">'+(nd.cl.lbl||(nd.cl.mode==='all'?'Tap each one that is met:':'Tap each one that is present:'))+'</p><div class="clrows">'+nd.cl.items.map(function(x,j){return '<button class="clrow'+(checkedItems.has(j)?' ckd':'')+'" onclick="toggleCl('+j+')" aria-pressed="'+checkedItems.has(j)+'"><span class="clbx" aria-hidden="true">'+ico('check',12)+'</span><span>'+x+'</span></button>';}).join('')+'</div><p class="clst" id="clst">'+clStatus(nd)+'</p></div>';
    b+='<div class="ots" id="cl-ots">'+clOpts(nd,met)+'</div>';
  } else
  if(nd.tiers){
    const st=tierState(nd);let ix=0,embPlaced=false;
    nd.tiers.forEach(function(t){
      b+='<p class="tier-h '+t.cls+'">'+esc(t.name)+'</p><div class="tck">';
      let g='';
      t.items.forEach(function(it){
        const item=typeof it==='string'?{t:it}:it;
        if(item.grp&&item.grp!==g){g=item.grp;b+='<p class="grp-h">'+esc(g)+'</p>';}
        b+=checkRow(item.t,ix,checkedItems.has(ix),false);ix++;
        if(nd.embed&&!embPlaced&&/age-specific hypotension/i.test(item.t)){b+=embedH(nd.embed);embPlaced=true;}
      });
      b+='</div>';
    });
    if(nd.embed&&!embPlaced)b+=embedH(nd.embed);
    b+=riskCtrHTML(st);
    b+='<div class="ots" id="risk-ots">'+riskBtn(st)+'</div>';
  } else if(nd.riskCalc){
    const st=riskState(nd);
    b+='<div class="tck">'+st.rc.factors.map(function(f,j){return checkRow(f,j,checkedItems.has(j),false);}).join('')+'</div>';
    b+=riskCtrHTML(st);
    b+='<div class="ots" id="risk-ots">'+riskBtn(st)+'</div>';
  } else if(nd.checks){
    const ok=reqOk(nd);
    b+='<div class="tck">'+nd.checks.map(function(c,j){return checkRow(c,j,checkedItems.has(j),(nd.optional||[]).indexOf(j)>-1);}).join('')+'</div>';
    b+='<p class="ck-hint"'+(ok?' style="display:none"':'')+'>'+(nd.hint||'Check all items above to continue')+'</p>';
    b+='<div class="ots">'+nd.opts.map(function(o,k){const g=!nd.gateOnly||nd.gateOnly.indexOf(k)>-1;return optBtn(o,g,g&&!ok);}).join('')+'</div>';
  } else {
    b+='<div class="ots">'+nd.opts.map(function(o){return optBtn(o,false,false);}).join('')+'</div>';
  }
  if(hist.length){
    const hl=hist.length;
    b+=`<button class="trb" onclick="openDrawer()" aria-haspopup="dialog"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--blue)"><path d="M13 5h8"/><path d="M13 9h5"/><path d="M13 15h8"/><path d="M13 19h5"/><rect x="3" y="4" width="6" height="6" rx="1"/><rect x="3" y="14" width="6" height="6" rx="1"/></svg><span>${hl} decision${hl>1?'s':''} logged</span><span style="margin-left:auto;color:var(--border2)" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg></span></button>`;
  }
  if(drawer){
    const items=hist.map((h,j)=>{const n=nds()[h.nid];return`<div class="drwr"><div class="drwn" aria-hidden="true">${j+1}</div><div>${trailBody(h,'drwq','drwa')}</div></div>`;}).join('');
    b+=`<div class="drww" role="dialog" aria-modal="true"><div class="drwo" onclick="closeDrawer()"></div><div class="drwd"><div class="drwh"><span class="drwl">Decision trail</span><button class="drwc" onclick="closeDrawer()" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button></div>${items}</div></div>`;
  }
  return b+refH()+toolsH()+'</div>';
}
function refSec(h){const p=h.split(/<h4>/);let o=p[0];for(let i=1;i<p.length;i++){const j=p[i].indexOf('</h4>');o+='<details class="rfs"><summary>'+p[i].slice(0,j)+'</summary><div class="rfsb">'+p[i].slice(j+5)+'</div></details>';}return o;}
function refH(){return proto&&REF[proto.id]?'<details class="rfd"><summary>Reference details from the guideline</summary><div class="rfb">'+refSec(REF[proto.id])+'</div></details>':'';}

      </div>
    </div>
    <div class="clinks" id="chatLinks" hidden></div>
    <iframe
      id="chatFrame"
      src="https://www.chatbase.co/chatbot-iframe/${CHATBASE_ID}"
      style="flex:1;width:100%;border:none;display:block"
      allow="clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
      title="CHOA AI Assistant">
    </iframe>`;
  sw.appendChild(o);
}

function closeChat(){
  const o=document.getElementById('chatOv');
  if(o)o.remove();
}

// Chat replies -> "Open in app" buttons. The Chatbase iframe posts an
// 'assistant-message' event to this page when a reply finishes.
const PROTO_RX={
  tta:/\btta\b|trauma team activation|trauma alert|stat activation/i,
  bat:/\bbat\b|blunt abdominal|atomac/i,
  mtp:/\bmtp\b|massive transfusion/i,
  extremity:/vascular (and|&) extremity|extremity (and|&) vascular|extremity injur|vascular injur|hard signs/i,
  ir:/\bir after[- ]hours\b/i,
  tbi:/\btbi\b|traumatic brain|head injur|concussion|pecarn|\bicp\b|intracranial pressure/i,
  cspine:/c-?spine|cervical spine/i,
  open_fx:/open fracture|gustilo/i,
  long_bone:/long bone|femur fracture|femoral fracture/i,
  pelvic:/pelvic|acetabul|pelvis/i,
  vte:/\bvte\b|venous thromboembolism|enoxaparin/i,
  sbirt:/sbirt|crafft/i,
  csec:/csec|sex trafficking|sexual exploitation/i,
  nat:/\bnat\b|non-?accidental|child abuse|ten-4/i
};
function protoMatches(text){
  const found=[];
  const ex=/#\/p\/([a-z_]+)/g;let m;
  while((m=ex.exec(text))){if(LU[m[1]]&&found.every(function(f){return f.id!==m[1];}))found.push({id:m[1],at:-1});}
  Object.keys(PROTO_RX).forEach(function(id){
    const mm=text.match(PROTO_RX[id]);
    if(mm&&found.every(function(f){return f.id!==id;}))found.push({id:id,at:mm.index});
  });
  found.sort(function(a,b){return a.at-b.at;});
  return found.slice(0,3).map(function(f){return f.id;});
}
function showChatLinks(text){
  const bar=document.getElementById('chatLinks');if(!bar)return;
  const ids=protoMatches(text||'');
  if(!ids.length){bar.hidden=true;bar.innerHTML='';return;}
  bar.innerHTML='<span class="cl-l">Open in app</span>'+ids.map(function(id){return '<button class="cl-b" onclick="openFromChat(\''+id+'\')">'+LU[id].p.name+ico('chevron-right',13)+'</button>';}).join('');
  bar.hidden=false;
}
function openFromChat(id){closeChat();openById(id);}
window.addEventListener('message',function(ev){
  const f=document.getElementById('chatFrame');
  if(!f||ev.source!==f.contentWindow)return;
  let o='';try{o=new URL(f.src).origin;}catch(e){}
  if(ev.origin!==o)return;
  const d=ev.data;
  if(d&&d.type==='assistant-message'&&d.data&&typeof d.data.content==='string')showChatLinks(d.data.content);
});

// ── NAVIGATION ────────────────────────────────────────────────────
function goHome(){scr='home';cat=null;proto=null;nid='';hist=[];drawer=false;sq='';setTab('home');r();}
function openCat(k){sq='';cat=C[k];scr='browse';drawer=false;r();}
function openById(id){sq='';const e=LU[id];if(!e)return;proto=e.p;cat=C[e.cid];startTree();}
function clMet(nd){const n=checkedItems.size,m=nd.cl.items.length;return nd.cl.mode==='all'?n===m:n>0;}
function clStatus(nd){const n=checkedItems.size,m=nd.cl.items.length;
  return nd.cl.mode==='all'?(n===m?n+' of '+m+' met: YES selected':n+' of '+m+' met (all are needed for YES)'):(n?n+' checked: YES selected':'None checked');}
function clOpts(nd,met){return nd.opts.map(function(o){let h=optBtn(o,false,false);if(met&&(o.y||/^yes/i.test(o.l)))h=h.replace('class="ob ','class="ob pre ');return h;}).join('');}
function toggleCl(j){
  if(checkedItems.has(j))checkedItems.delete(j);else checkedItems.add(j);
  const nd=nds()[nid];if(!nd||!nd.cl)return;
  const el=document.querySelectorAll('.clrow')[j];if(el){el.classList.toggle('ckd',checkedItems.has(j));el.setAttribute('aria-pressed',checkedItems.has(j));}
  const s=document.getElementById('clst');if(s)s.textContent=clStatus(nd);
  const o=document.getElementById('cl-ots');if(o)o.innerHTML=clOpts(nd,clMet(nd));
}
function toggleCheck(idx){
  if(checkedItems.has(idx))checkedItems.delete(idx);else checkedItems.add(idx);
  const nd=nds()[nid];if(!nd)return;
  const rowEl=document.querySelectorAll('.tckr')[idx];
  if(rowEl){rowEl.classList.toggle('ckd',checkedItems.has(idx));rowEl.setAttribute('aria-pressed',checkedItems.has(idx));}
  if(nd.tiers||nd.riskCalc){
    const st=nd.tiers?tierState(nd):riskState(nd);
    const ctr=document.getElementById('risk-ctr');
    if(ctr){ctr.className='risk-ctr '+st.cls;ctr.querySelector('.risk-ct').textContent=st.count;ctr.querySelector('.risk-desc').textContent=st.desc;ctr.querySelector('.risk-lv').textContent=st.badge;}
    const ots=document.getElementById('risk-ots');if(ots)ots.innerHTML=riskBtn(st);
    return;
  }
  if(nd.checks){
    const ok=reqOk(nd);
    document.querySelectorAll('.ob[data-g]').forEach(function(bt){bt.disabled=!ok;});
    const hint=document.querySelector('.ck-hint');if(hint)hint.style.display=ok?'none':'block';
  }
}
function startTree(){const t=tobj();if(!t)return;nid=t.start;hist=[];drawer=false;checkedItems=new Set();scr='tree';r();}
function selTexts(n){let ix=0;const out=[];
  if(n.tiers){n.tiers.forEach(function(t){t.items.forEach(function(it){if(checkedItems.has(ix))out.push(plainT(typeof it==='string'?it:it.t));ix++;});});}
  else if(n.riskCalc){n.riskCalc.factors.forEach(function(f,i){if(checkedItems.has(i))out.push(plainT(f));});}
  else if(n.cl){n.cl.items.forEach(function(f,i){if(checkedItems.has(i))out.push(plainT(f));});}
  return out;}
function trailBody(h,qc,ac){const n=nds()[h.nid];
  return '<div class="'+qc+'">'+esc(n?plainT(n.q):'')+'</div><div class="'+ac+'">'+esc(h.ans)+'</div>'+(h.sel&&h.sel.length?'<ul class="tmsel">'+h.sel.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'');}
function pick(nx,ans){const cn=nds()[nid];hist.push({nid,ans,sel:cn&&(cn.tiers||cn.riskCalc||cn.cl)?selTexts(cn):null});nid=nx;drawer=false;checkedItems=new Set();scr=ends()[nid]?'terminal':'tree';r();}
function goBack(){
  drawer=false;checkedItems=new Set();
  if(scr==='terminal'){if(hist.length){const p=hist.pop();nid=p.nid;scr='tree';}else{scr='browse';if(cat)setTab(cat.key);}r();return;}
  if(scr==='tree'){if(hist.length){const p=hist.pop();nid=p.nid;}else{scr='browse';if(cat)setTab(cat.key);}r();return;}
  if(scr==='browse'){scr='home';cat=null;setTab('home');r();return;}
}
function backToCat(){scr='browse';if(cat)setTab(cat.key);r();}
function openDrawer(){drawer=true;r();}
function closeDrawer(){drawer=false;r();}
function switchTab(id){setTab(id);if(id==='home')goHome();else{sq='';cat=C[id];scr='browse';drawer=false;r();}}
function setTab(id){
  document.querySelectorAll('.tab').forEach(t=>{
    const on=t.id.replace('t-','')===id;
    t.classList.toggle('on',on);
    t.setAttribute('aria-current',on?'true':'false');
  });
}

// ── DEEP LINKS ────────────────────────────────────────────────────
// #/p/<protocol id> opens a protocol, #/c/<category> opens a category.
function setHash(h){try{if((location.hash||'')!==h)history.replaceState(null,'',location.pathname+location.search+h);}catch(e){}}
function syncHash(){
  if(scr==='tree'||scr==='terminal')setHash(proto?'#/p/'+proto.id:'');
  else if(scr==='browse')setHash(cat?'#/c/'+cat.key:'');
  else setHash('');
}
function routeFromHash(){
  const m=(location.hash||'').match(/^#\/([pc])\/([a-z_]+)$/);
  closeChat();
  if(!m)return false;
  if(m[1]==='p'&&LU[m[2]]){openById(m[2]);return true;}
  if(m[1]==='c'&&C[m[2]]){switchTab(m[2]);return true;}
  return false;
}
window.addEventListener('hashchange',function(){if(!routeFromHash())goHome();});

// ── THEME ─────────────────────────────────────────────────────────
const ICON_MOON='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6.4 6.4 0 0 0 9 9a9 9 0 1 1 -9 -9z"/></svg>';
const ICON_SUN='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4 -1.4"/><path d="M17.7 6.3l1.4 -1.4"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('choa-theme',t);}catch(e){}
  const tt=document.getElementById('themeToggle');
  if(tt){tt.innerHTML=t==='dark'?ICON_SUN:ICON_MOON;tt.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');}
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
applyTheme((function(){try{return localStorage.getItem('choa-theme')||'light';}catch(e){return 'light';}})());

if(!routeFromHash())r();
</script>
