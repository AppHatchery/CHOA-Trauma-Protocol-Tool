<style>
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--r:12px}
html[data-theme=light]{

--t1:#2A2F38;--t2:#454B56;--t3:#646B77;
--blue:#1B4638;--blue-dk:#123327;--blue-lt:#E6F2EC;--blue-bd:#B9DACB;--on-accent:#fff;--accent-tx:#1B4638;
--green:#1F7A5C;--green-lt:#E2F4EC;--green-bd:#B4E0CE;
--act:#6A2FD0;--act-lt:#F2EAFD;--act-bd:#D9C3F7;--on-act:#fff;
--red:#C5431F;--red-lt:#FDEEE8;--red-bd:#F6CBBC;
--amber:#8A6D00;

--font:'Roboto',system-ui,-apple-system,sans-serif;--head:'Darker Grotesque','Roboto',system-ui,sans-serif;
--cat-emergency:#EC6740;--cat-neuro:#8642EE;--cat-ortho:#2C8C6F;--cat-screen:#B5C13A;
--tc-tree:#1B4638;--tb-tree:#E6F2EC;--tc-calc:#555B0C;--tb-calc:#F4F7C9;--tc-reference:#5B21B6;--tb-reference:#F1E8FD;
}
html[data-theme=dark]{
--desk:#15191F;--frame:#000;--frame-b:rgba(255,255,255,.1);--notch:#000;--pb:#2A2F38;--hi:rgba(255,255,255,.25);
--bg:#20252C;--card:#2A2F38;--hover:#323845;--border:#3A414D;--border2:#4D5666;
--t1:#F6F4EE;--t2:#D4D7DC;--t3:#A5ACB7;
--blue:#8FE3C9;--blue-dk:#B8F0DF;--blue-lt:rgba(143,227,201,.12);--blue-bd:rgba(143,227,201,.34);--on-accent:#10301F;--accent-tx:#A9EBD6;
--green:#6FD9B0;--green-lt:rgba(111,217,176,.12);--green-bd:rgba(111,217,176,.34);
--act:#C89DF5;--act-lt:rgba(200,157,245,.13);--act-bd:rgba(200,157,245,.36);--on-act:#2A1450;
--red:#FF9170;--red-lt:rgba(255,145,112,.13);--red-bd:rgba(255,145,112,.34);
--amber:#D9E55C;
--nav:#1B4638;--nav-t:#F6F4EE;--nav-sub:#9CCBB8;--nav-line:rgba(255,255,255,.14);--nav-ghost:rgba(255,255,255,.08);
--pip:#1B4638;--on-pip:#F6F4EE;
--sh:0 2px 10px rgba(0,0,0,.32);--glow:0 0 14px rgba(143,227,201,.35);
--font:'Roboto',system-ui,-apple-system,sans-serif;--head:'Darker Grotesque','Roboto',system-ui,sans-serif;
--cat-emergency:#FF9170;--cat-neuro:#C89DF5;--cat-ortho:#6FD9B0;--cat-screen:#D9E55C;
--tc-tree:#A9EBD6;--tb-tree:rgba(143,227,201,.15);--tc-calc:#E3EC84;--tb-calc:rgba(217,229,92,.15);--tc-reference:#DDBFF9;--tb-reference:rgba(200,157,245,.16);
}
h1,h2,h3,h4,.tq,.tmti,.fn,.bnn,.drwl,.nt{font-family:var(--head);font-weight:800;letter-spacing:-.01em}
.tq{font-size:23px;line-height:1.15}.tmti{font-size:24px;line-height:1.15}.fn{font-size:20px}.rsc h3{font-size:20px}
body{font-family:var(--font);margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;background:var(--desk);transition:background .3s}








.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:relative;width:100%;max-width:430px;margin:0 auto;background:var(--nav);-webkit-overflow-scrolling:touch}
@media(min-width:431px){body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#102a21 0%,#1B4638 100%);z-index:-1}}
.topbar{background:var(--nav);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
.is{height:env(safe-area-inset-top,0px)}
.nr{display:flex;align-items:center;height:50px;border-top:1px solid var(--nav-line)}
.nbk{display:none;align-items:center;align-self:stretch;gap:3px;padding:0 14px 0 10px;font-size:14px;font-weight:500;color:var(--nav-t);background:none;border:none;border-right:1px solid var(--nav-line);cursor:pointer;white-space:nowrap;flex-shrink:0}
.nbk.v{display:flex}.nbk:active{background:var(--nav-ghost)}
@media(hover:hover) and (pointer:fine){.nbk:hover{background:var(--nav-ghost)}}
.nt{flex:1;padding:0 14px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--nav-t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ns{font-size:11px;font-weight:500;color:var(--nav-sub);padding-right:14px;flex-shrink:0}
.thm{display:none;align-items:center;justify-content:center;align-self:stretch;width:48px;background:none;border:none;border-left:1px solid var(--nav-line);color:var(--nav-t);cursor:pointer;flex-shrink:0}
.thm:active{background:var(--nav-ghost)}
@media(hover:hover) and (pointer:fine){.thm:hover{background:var(--nav-ghost)}}
.content{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);-webkit-overflow-scrolling:touch}.content::-webkit-scrollbar{display:none}
.shell{background:var(--bg)}
.topbar{background:var(--bg)}
.nr{height:auto;min-height:56px;border-top:none;gap:10px;padding:8px 14px;align-items:center}
.nbk{align-self:center;height:36px;padding:0 14px 0 8px;border:none;border-radius:18px;background:var(--pip);color:var(--on-pip);font-size:13px;font-weight:500}
.nbk:active{background:var(--blue-dk)}
.nwrap{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.nk{display:none;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.nt{padding:0;font-size:22px;line-height:1.05;color:var(--t1)}
.ns{padding-right:0;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.thm{align-self:center;width:38px;height:38px;border:1px solid var(--border2);border-radius:19px;background:var(--card);color:var(--t1)}
.thm:active{background:var(--blue-lt)}
.topbar.home .nr{padding-top:14px;padding-bottom:10px;min-height:76px}
.topbar.home .nk{display:block}
.topbar.home .nt{font-size:36px;line-height:.95;white-space:normal}
.tabbar{flex-shrink:0;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 2px;border-top:2px solid transparent;height:62px}
.tab.on{border-top-color:var(--tc,var(--blue))}
.tab svg{color:var(--t2)}.tab.on svg{color:var(--tc,var(--blue))}
html[data-theme=dark] .tab svg{color:#fff}
html[data-theme=dark] .tab.on{border-top-color:var(--blue)}
html[data-theme=dark] .tab.on svg,html[data-theme=dark] .tab.on .tlb{color:var(--blue)}
html[data-theme=dark] .tlb{color:#E4E6EA}
.tab:active{background:var(--hover)}
@media(hover:hover) and (pointer:fine){.tab:hover{background:var(--hover)}}
.tab i{font-size:20px;color:var(--t3)}.tab.on i{color:var(--tc,var(--blue))}
.tlb{font-size:9.5px;font-weight:500;color:var(--t3);white-space:nowrap}.tab.on .tlb{font-weight:700;color:var(--tc,var(--blue))}
.fab{position:absolute;right:14px;z-index:100;width:46px;height:46px;border-radius:23px;background:var(--blue);color:var(--on-accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(27,70,56,.35);bottom:calc(62px + env(safe-area-inset-bottom,0px) + 14px);transition:bottom 200ms ease}
.fab.inp{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.fab:active{background:var(--blue-dk)}
@media(hover:hover) and (pointer:fine){.fab:hover{background:var(--blue-dk)}}
.so{padding:12px 14px 10px}
.sb{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:0 10px 0 12px;box-shadow:var(--sh)}
.sb:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-lt)}
.sb input{flex:1;border:none;background:none;padding:11px 0;font-size:15px;font-family:inherit;color:var(--t1);outline:none}
.sb input::placeholder{color:var(--t3)}
.sclr{background:none;border:none;cursor:pointer;color:var(--t3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sclr:active{background:var(--border)}
.sh{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--t3);padding:6px 14px}
.cats-grid{display:flex;flex-direction:column;gap:9px;padding:0 14px 16px}
.cat-card{display:flex;flex-direction:column;width:100%;padding:16px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:border-color 150ms,box-shadow 150ms}
.cat-card:active{background:var(--hover);border-color:var(--border2);box-shadow:none}
@media(hover:hover) and (pointer:fine){.cat-card:hover{border-color:var(--border2)}}
.cl{background:var(--card);border-radius:var(--r);margin:0 14px 10px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh)}
.cbtn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 13px;background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left}
.cbtn:last-child{border-bottom:none}
@media(hover:hover) and (pointer:fine){.cbtn:hover{background:var(--hover)}}
.cbtn:active{background:var(--hover)}
.cion{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cion i{font-size:19px;color:#fff}
.cin{flex:1;min-width:0}.cna{font-size:15px;font-weight:600;color:var(--t1);margin-bottom:2px}.csu{font-size:11.5px;color:var(--t3)}
.cbdg{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;flex-shrink:0}
.fo{padding:0 14px 14px}
.fb{display:flex;flex-direction:column;width:100%;padding:16px;background:var(--pip);border:none;border-radius:var(--r);cursor:pointer;text-align:left;position:relative;overflow:hidden;box-shadow:var(--sh)}
.fb:active{opacity:.9}
.ft{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--nav-sub);margin-bottom:7px}
.fn{font-size:16.5px;font-weight:700;color:var(--on-pip);letter-spacing:-.02em;margin-bottom:5px}
.fs{font-size:13px;color:var(--nav-sub);line-height:1.5;padding-right:24px}
.bh{display:flex;align-items:center;gap:12px;padding:16px 14px 12px}
.bic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bic i{font-size:23px;color:#fff}
.bnn{font-size:21px;font-weight:700;color:var(--t1);letter-spacing:-.025em;line-height:1.2}.bsu{font-size:13px;color:var(--t3);margin-top:2px}
.pr{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px;background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer;text-align:left}
.pr:last-child{border-bottom:none}
@media(hover:hover) and (pointer:fine){.pr:hover{background:var(--hover)}}
.pr:active{background:var(--hover)}
.pbar{width:3px;height:40px;border-radius:2px;flex-shrink:0;background:var(--border2)}
.pin{flex:1;min-width:0}.pna{font-size:14.5px;font-weight:600;color:var(--t1);margin-bottom:4px;line-height:1.2}
.pm{display:flex;align-items:center;gap:6px}.pty{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}.ppo{font-size:10.5px;color:var(--t3)}
.pch i{font-size:16px;color:var(--border2)}
.nores{padding:24px 14px;text-align:center;font-size:14.5px;color:var(--t3);line-height:1.6}
.tw{background:var(--bg);min-height:100%;padding-bottom:76px}
.prg{display:flex;align-items:center;gap:5px;padding:14px 14px 10px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:all 220ms}
.dot.dn{background:var(--blue);opacity:.4}.dot.dc{background:var(--blue);width:22px;border-radius:4px;box-shadow:var(--glow)}
.tk{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);padding:0 14px 8px}
.tq{font-size:18px;font-weight:700;color:var(--t1);padding:0 14px 10px;line-height:1.35;letter-spacing:-.02em}
.tif{margin:0 14px 12px;padding:11px 13px;background:var(--blue-lt);border-left:3px solid var(--blue);font-size:13px;color:var(--accent-tx);line-height:1.55;border-radius:0 8px 8px 0}
.tck{margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tckr{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);font-size:13.5px;color:var(--t2);width:100%;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;text-align:left;font-family:inherit}
.tckr:last-child{border-bottom:none}
@media(hover:hover) and (pointer:fine){.tckr:hover{background:var(--hover)}}
.tckr:active{background:var(--blue-lt)}
.tckr.ckd{background:var(--blue-lt)}
.tcci{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;transition:all 150ms}
.tckr.ckd .tcci{border-color:var(--blue);background:var(--blue);color:var(--on-accent)}
.opt-note{font-style:normal;font-size:11px;color:var(--t3);margin-left:4px}
.ob:disabled{opacity:.35;cursor:not-allowed}
.ck-hint{font-size:11px;color:var(--t3);padding:4px 14px 10px;text-align:center}
.stp{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
.entryd{margin:0 0 6px}.entryd summary{cursor:pointer;font-weight:600;font-size:12.5px}.entryd p{margin:6px 0 0;font-weight:500}
.tif p{margin:0 0 6px}.tif p:last-child{margin-bottom:0}
.il{margin:4px 0 4px 18px;padding:0}.il li{margin:2px 0}.il ul{margin:2px 0 2px 16px;padding:0}
.rn{font-size:12px;color:var(--t3);margin:6px 0 0}
.tier-h{margin:6px 14px 6px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t2)}
.tier-h.high{color:var(--red)}.tier-h.mod{color:var(--act)}
.grp-h{margin:0;padding:8px 13px 4px;font-size:11px;font-weight:700;color:var(--t3);background:var(--hover);border-bottom:1px solid var(--border)}
.tckr span ul{margin:4px 0 0 16px;padding:0;font-size:12.5px;color:var(--t3)}
.tck .emb{margin:0;border:none;border-top:1px solid var(--border);border-radius:0;background:var(--blue-lt)}
.emb{margin:0 14px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--card);padding:0}
.emb summary{cursor:pointer;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--blue)}
.emb .emn{margin:0;padding:0 13px 8px;font-size:12px;color:var(--t3)}
.emb .emlink{display:inline-block;margin:0 13px 10px;font-size:13px;font-weight:700;color:var(--blue)}
.emb iframe{width:100%;height:520px;border:0;border-top:1px solid var(--border);background:#fff}
.tmbd .dt{margin:10px 0 0;border:1px solid var(--border);border-radius:8px;background:var(--card)}
.tmbd .dt summary{cursor:pointer;padding:10px 12px;font-weight:700;color:var(--t1)}
.tmbd .dt ol{margin:0 12px 10px 28px;padding:0}.tmbd .dt li{margin:8px 0}
.rfd{margin:12px 14px 0;border:1px solid var(--border);border-radius:var(--r);background:var(--card)}
.rfd summary{cursor:pointer;padding:11px 13px;font-size:13px;font-weight:700;color:var(--blue)}
.rfb{padding:0 13px 12px;font-size:13px;color:var(--t2);line-height:1.5}.rfb h4{margin:12px 0 4px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--t1)}.rfb p{margin:4px 0}
.rt{overflow-x:auto}.rt table{border-collapse:collapse;font-size:12px}.rt th,.rt td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top}
.tools{display:flex;gap:8px;margin:14px 14px 0;flex-wrap:wrap}
.tbtn{flex:1 1 140px;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:var(--r);border:1px solid var(--border2);background:var(--card);color:var(--t2);font:600 13px inherit;font-family:inherit;cursor:pointer}
.tbtn:active{background:var(--blue-lt)}
.ovl{position:absolute;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column}
.ovh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;border-bottom:1px solid var(--border);background:var(--card)}
.ovh .ovt{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--t1);line-height:1.3}
.ovh button,.ovh a{font:600 13px inherit;font-family:inherit;color:var(--blue);background:none;border:none;cursor:pointer;text-decoration:none;padding:6px 4px}
.ovb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--hover);padding:8px}
.ovb img{display:block;width:100%;height:auto;margin:0 0 8px;background:#fff;border-radius:4px;cursor:zoom-in}
.ovb.z img{width:230%;max-width:none;cursor:zoom-out}
.ovhint{font-size:11.5px;color:var(--t3);text-align:center;padding:2px 0 8px}
.rsh{position:absolute;inset:0;z-index:300;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.rsc{width:100%;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:90%;overflow:auto}
.rsc h3{margin:0 0 4px;font-size:16px;color:var(--t1)}
.rsc .rctx{font-size:12px;color:var(--t3);margin:0 0 12px;line-height:1.4}
.rchips{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.rchip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border2);border-radius:10px;background:none;color:var(--t2);font:500 13.5px inherit;font-family:inherit;text-align:left;cursor:pointer}
.rchip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-lt);color:var(--t1);font-weight:600}
.rsc textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid var(--border2);border-radius:10px;padding:10px;font:13.5px inherit;font-family:inherit;background:var(--bg);color:var(--t1);margin:0 0 10px;resize:vertical}
.rsc .rsend{width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--blue);color:var(--on-accent);font:700 14px inherit;font-family:inherit;cursor:pointer}
.rsc .rcancel{width:100%;padding:10px;border:none;background:none;color:var(--t3);font:600 13px inherit;font-family:inherit;cursor:pointer;margin-top:4px}
.rsc .rdone{font-size:13.5px;color:var(--t1);line-height:1.5}
.risk-ctr{margin:0 14px 10px;padding:13px 14px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--card);display:flex;align-items:center;gap:12px;transition:background 200ms,border-color 200ms;box-shadow:var(--sh)}
.risk-ctr.mod{background:var(--act-lt);border-color:var(--act-bd)}
.risk-ctr.high{background:var(--red-lt);border-color:var(--red-bd)}
.risk-ct{font-size:31px;font-weight:800;letter-spacing:-.04em;color:var(--t3);line-height:1;min-width:34px;text-align:center;transition:color 200ms}
.risk-ctr.mod .risk-ct{color:var(--act)}

  mtp:{start:"mtp0",nodes:{
    "mtp0":{"q":"Select every MTP activation indication that applies","k":"MTP indications","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Injured or bleeding patient: provider considers activating the Massive Transfusion Protocol</p></details><p>Select all that apply. Any one indication supports activating MTP.</p>","tiers":[{"name":"MTP activation indications","nx":"mtpgo","cls":"high","items":[{"t":"Clinical massive hemorrhage in hard to control area","grp":"Uncontrolled bleeding"},{"t":"Uncontrolled bleeding, ongoing blood loss &gt; 150 mL/minute","grp":"Uncontrolled bleeding"},{"t":"Loss of 50% of blood volume within 4 hours","grp":"Uncontrolled bleeding"},{"t":"Loss of 1 blood volume in 24 hours (blood volume loss of 70 mL/kg in children and adolescents and 85 mL/kg in infants)","grp":"Uncontrolled bleeding"},{"t":"Penetrating torso trauma","grp":"Other indications"},{"t":"Age-specific hypotension","grp":"Other indications"},{"t":"Need for emergency release blood in a trauma patient located in the ER, OR or PICU","grp":"Also listed in the ED flowchart box \"Indications for Trauma MTP\""},{"t":"Patients who have received blood product from the referring facility","grp":"Also listed in the ED flowchart box \"Indications for Trauma MTP\""}]}],"nxNone":"Enone","noneLbl":"None selected — continue","embed":{"title":"Age-specific hypotension: SIPA calculator","url":"https://www.mdcalc.com/calc/10058/shock-index-pediatric-age-adjusted-sipa","note":"Use the Shock Index, Pediatric Age-Adjusted (SIPA) calculator from MDCalc to check this indication."}}
  },ends:{
    "mtpgo":{"type":"esc","tag":"Activate MTP","title":"Initiate the Massive Transfusion Protocol","body":"<p>Start by confirming the activation indications, then follow the workflow for where the patient is. Both are from Policy 7-23.</p><details class=\"dt\"><summary>Patient in the ED: BloodTrack workflow (steps 1–11)</summary><ol class=\"il\"><li><b>ED workflow step 1–2: MD identifies need; Team Lead RN/Scribe RN notifies the Blood Bank and places orders</b><ul class=\"il\"><li>1. MD identifies need for MTP</li><li>2. Team Lead RN/Scribe RN:<ul><li>Calls the blood bank to notify them of initiation of MTP for patient</li><li>Places order for MTP labs, Initiation of MTP (nurse instructional) order and Blood Product (per physician verbal order in mL/kg) in Epic</li></ul></li></ul></li><li><b>ED workflow step 3a: RN takes the green form to the BloodTrack refrigerator for the 1st package</b><ul class=\"il\"><li>RN takes Blood Bank Product Request Release Form (\"green form\") with patient label and weight to the BloodTrack refrigerator to obtain 1st package of MTP</li><li>If blood is not available in the BloodTrack refrigerator, go to the Blood Bank to retrieve the blood</li><li>ED RN/Medic/Tech/Lab draws MTP and Trauma Labs prior to blood administration</li></ul></li><li><b>ED workflow step 4: Access the BloodTrack system</b><ul class=\"il\"><li>a) RN scans network ID barcode or manually enters network ID and enters numeric password</li><li>b) RN selects \"Touch here for MTP Packs\"</li><li>c) RN selects MTP pack for patient's weight in kg</li><li>d) RN scans patient's linear barcode and verifies HAR</li></ul></li><li><b>ED workflow step 5: Remove blood product from the BloodTrack system</b><ul class=\"il\"><li>a) BloodTrack door opens</li><li>b) Drawer illuminates</li><li>c) RN opens the illuminated drawer and removes blood product for the 1st MTP package</li><li>d) RN closes drawer</li></ul></li><li><b>ED workflow step 6: RN inspects the blood product. Is the product acceptable?</b><ul class=\"il\"><li>Inspection criteria: package intact, blood product is cold, no coagulation or change in color noted, and correct labeling</li></ul></li><li><b>ED workflow step 7: RN scans the unit and documents visual inspection</b><ul class=\"il\"><li>RN scans unit and documents visual inspection of the unit in the BloodTrack system. Transaction is then approved.</li></ul></li><li><b>ED workflow step 8: Repeat steps 5–7 for each product</b><ul class=\"il\"><li>Repeat steps 5–7 until the BloodTrack system displays \"You have successfully taken all the products for this MTP package. Close the door.\"</li><li>The BloodTrack system continues to release blood products until the last product of the 1st MTP package has been retrieved</li></ul></li><li><b>ED workflow step 9: Place all blood products in the cooler and take to bedside</b><ul class=\"il\"><li>Place all blood products in cooler and take to bedside for administration</li><li>Blood is safe for use up to 8 hours after placed in cooler</li></ul></li><li><b>ED workflow step 10: Blood administration and documentation</b><ul class=\"il\"><li>a) Confirm volume (mL/kg) and rate for blood product infusion with physician before administration of each blood product</li><li>b) Verify and administer blood product per policy 7.02 Administration of Blood and Blood Products utilizing a blood warming device</li><li>c) Document each blood product administration in the Blood Product Administration template in Epic</li><li>d) Complete required documentation on the Transfusion Record and ensure the document is scanned into the patient's medical record</li></ul></li><li><b>ED workflow step 11: Continue until the Trauma Surgeon or ED Physician orders discontinuation of MTP</b><ul class=\"il\"><li>Continue to administer blood products per physician order and MTP protocol until Trauma Surgeon or ED Physician orders the discontinuation of MTP</li><li>Blood runner will be dispatched to collect subsequent MTP packages as requested by the Physician Team Lead</li><li>If the patient is admitted, transport remaining blood products with the patient and notify the Blood Bank of the admission destination. Provide the admitting nurse with the volume of each blood product that has been transfused prior to admission</li><li>If MTP is discontinued, notify the Blood Bank and return remaining blood products to the Blood Bank</li><li>If MTP is discontinued prior to obtaining the 2nd MTP package, notify the Blood Bank and return remaining blood products and the \"green form\" to the Blood Bank</li><li><b>Second package (flowchart box 3b):</b> after the patient arrives and the MD determines the need for a 2nd MTP package, an ED Blood Runner is dispatched to the Blood Bank with the completed green form. Bring a pink top blood sample, if possible, for type and screen; otherwise bring a pink top when returning for the next package. The Blood Bank begins packing the 2nd MTP package in a cooler at this time. The ED Runner may need to retrieve O-negative RBCs and platelets, then return to the Blood Bank to retrieve the cryoprecipitate and plasma to complete the 2nd package</li><li>If the green form is not received, the Blood Bank will contact the ANM on duty to resolve</li></ul></li></ol></details><details class=\"dt\"><summary>Patient not in the ED: initiation process B–G</summary><ol class=\"il\"><li><b>Non-ED, process B (1): Provider requests initiation; order placed in Epic</b><ul class=\"il\"><li>A patient's provider requests the initiation of MTP and an order is placed in Epic to document initiation of MTP</li></ul></li><li><b>Non-ED, process B (2): Contact the Blood Bank</b><ul class=\"il\"><li>A provider or their designee contacts the Blood Bank: Arthur M. Blank 5-6421; Scottish Rite 5-2045</li></ul></li><li><b>Non-ED, process B (3): Complete the Blood Bank Product Request Release Form</b><ul class=\"il\"><li>Complete the \"Blood Bank Product Request Release Form\" Massive Transfusion protocol section. The Physician must sign, date and time the form</li><li>If the responsible Physician is unable to sign at the time of initiation, their designee or another Physician can complete the documentation on their behalf. The initiating provider will have 24 hours from MTP initiation to sign all documentation</li></ul></li><li><b>Non-ED, process B (4): Check \"Initiate MTP\", add weight, send staff to the Blood Bank</b><ul class=\"il\"><li>Check the \"Initiate MTP\" box and include the patient's weight. Send a designated staff member to the blood bank with the completed form</li><li>To pick up subsequent MTP packs, bring either the photocopy of the original completed form or a new completed form so units are allocated to the correct patient</li><li>This form should NEVER be sent to the blood bank via the pneumatic tube system</li><li>This form should transfer with the patient from one patient care area to another. A new form is not indicated in a new patient care area unless the previous MTP has been discontinued</li><li>No other forms or orders for blood products are required once the form is completed and the MTP has been initiated</li></ul></li><li><b>Non-ED, process C: Required specimens</b><ul class=\"il\"><li>Collect both a lavender/purple and a light blue specimen for MTP Labs and Nursing Orders available in Epic. Specimens must have a patient label, handwritten date, time, STAT, and collector's initials. Send to main lab and notify lab personnel that specimens are for STAT massive transfusion protocol</li><li>MTP Labs and Nursing Orders: CBC, PT, PTT, D-Dimer &amp; Fibrinogen, Type &amp; Screen, ABORh, and CG8</li><li>A provider must order the initial labs in Epic (type MTP). Orders for post-transfusion labs should be ordered using the Subsequent MTP Labs order group in Epic. Hemoglobin/Hematocrit/Platelet (HHP) replaces CBC within \"Subsequent MTP labs\"</li><li>A separate lavender/purple specimen should be sent to the Blood Bank for blood type and screen, collected as soon as possible</li><li>MTP Labs and Nursing Orders should be considered after every package is completely transfused or at the provider's discretion. Type and screen only has to be performed once every 72 hrs. ABORh is required for all patients with no blood type on file if the specimen was not collected by phlebotomy</li><li>24 hours after MTP ends, send a new lavender/purple top specimen for repeat blood typing. If the patient's blood type has changed from baseline after a large volume of universally compatible product (i.e., baseline AB/Rh positive now typing as O/Rh negative), the lab obtains approval from an on-call blood bank provider or medical director to document this temporary blood type in the electronic medical record</li></ul></li><li><b>Non-ED, process D: Consent and blood product administration</b><ul class=\"il\"><li>Blood products can be administered in an emergency without obtaining a blood product consent (see policy PC 7-03 Consent for Transfusion of Blood and/or Blood Products). The consent must be obtained as soon as possible</li><li>In emergency situations, Children's uses various methods of rapid infusion to deliver large volumes of warmed blood and blood products at high flow rates. A provider order is required prior to initiating any rapid infusion. Follow the manufacturer's instructions for use</li></ul></li><li><b>Non-ED, process E: Coolers in transport</b><ul class=\"il\"><li>During MTP, coolers may be transferred between patient care areas accompanying the patient</li><li>Once the MTP has been terminated, all coolers (and their components) and unused blood products must be returned to the blood bank as soon as possible. Discard spiked or partially used products</li></ul></li><li><b>Process F: Termination of MTP</b><ul class=\"il\"><li>The provider must terminate the MTP when they deem clinically indicated. The Blood Bank will continue to prepare blood products for subsequent MTP packages until an official termination of MTP is completed</li><li>Termination is complete once a phone call is made to the Blood Bank with the name of the provider and an order is placed in Epic. Blood Bank: Arthur M. Blank 5-6421; Scottish Rite 5-2045</li><li><b>Process G, systematic oversight:</b> the Blood Bank Medical Director or designee reviews MTP cases to determine if initiation was appropriate (at least quarterly, at each campus-specific MTP review committee meeting and/or the system Transfusion Safety Oversight Committee), correlating lab data and clinical status to see if MTP was effective in mitigating coagulopathy and improving morbidity/mortality</li></ul></li></ol></details>"},
    "Enone":{"type":"ok","tag":"Not specified","title":"No MTP indication selected","body":"<p>The policy gives no \"No\" branch, so what to do when no indication is met is not specified.</p>"}
  }},
  vte:{start:"mob",nodes:{
    "mob":{"q":"What is the patient's mobility status?","k":"Mobility status","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Patient in the PICU. Assess all patients at admission to PICU and upon any change in diagnosis/symptoms/surgical severity. The patient should receive the standard intervention based on risk level within 24 hours of admission. Use the order set for PICU Venous Thromboembolism Prophylaxis Orders in Epic.</p></details><ul class=\"il\"><li><b>Baseline:</b> usual state of ambulation or mobility</li><li><b>Altered:</b> intubation, temporary inability to ambulate freely; includes an acute state of altered mobility or due to pharmacologic interventions, or injury. Expected immobility ≥ 72 hrs</li></ul>","opts":[{"l":"Baseline","s":"ok","nx":"rfB"},{"l":"Altered","s":"ok","nx":"rfA"}]},
    "rfB":{"q":"Baseline mobility: how many VTE risk factors does the patient have?","k":"VTE risk factors (baseline mobility)","info":"<p>Select every VTE risk factor the patient has. Baseline mobility: 1 or more = At risk.</p>","riskCalc":{"threshold":1,"factors":["Antiphospholipid antibody syndrome","Braden Q ≤ 16 in the past 12 hours","Burns &gt; 50% body surface area","Cancer or malignancy, active","Critically ill","CVL or PICC, recent or current","Cyanotic heart disease or low-flow state","Dehydration, severe","DKA","Exogenous estrogen / oral contraceptive use, current or within 2 past weeks","Family history of VTE in 1st degree relative","Hyperosmolar state","Immobilization, chronic","Infection or sepsis (acute)","Inflammatory bowel disease (IBD)","Inherited thrombophilia (Deficiencies: Protein C, S, or antithrombin; Gene mutations: Factor V Leiden or prothrombin)","Obesity (&lt; 18 years old &amp; BMI &gt; 95th percentile; ≥ 18 years old &amp; BMI &gt; 30)","Personal history of DVT/PE/Stroke","Protein-losing disorder: nephrotic syndrome, chylous effusion, enteropathy","Spinal cord injury","Surgery (within last 30 days)","Systemic lupus erythematosus (SLE)","Trauma"],"nxLow":"low","nxHigh":"atB","unit":"VTE risk factor","noun":"factor","lowName":"Low risk","highName":"At risk","lowBadge":"LOW RISK","highBadge":"AT RISK","suffix":"1 or more = At risk","zeroLbl":"None — Continue (Low risk)"}},
    "rfA":{"q":"Altered mobility: how many VTE risk factors does the patient have?","k":"VTE risk factors (altered mobility)","info":"<p>Select every VTE risk factor the patient has. Altered mobility: 2 or more = High risk.</p>","riskCalc":{"threshold":2,"factors":["Antiphospholipid antibody syndrome","Braden Q ≤ 16 in the past 12 hours","Burns &gt; 50% body surface area","Cancer or malignancy, active","Critically ill","CVL or PICC, recent or current","Cyanotic heart disease or low-flow state","Dehydration, severe","DKA","Exogenous estrogen / oral contraceptive use, current or within 2 past weeks","Family history of VTE in 1st degree relative","Hyperosmolar state","Immobilization, chronic","Infection or sepsis (acute)","Inflammatory bowel disease (IBD)","Inherited thrombophilia (Deficiencies: Protein C, S, or antithrombin; Gene mutations: Factor V Leiden or prothrombin)","Obesity (&lt; 18 years old &amp; BMI &gt; 95th percentile; ≥ 18 years old &amp; BMI &gt; 30)","Personal history of DVT/PE/Stroke","Protein-losing disorder: nephrotic syndrome, chylous effusion, enteropathy","Spinal cord injury","Surgery (within last 30 days)","Systemic lupus erythematosus (SLE)","Trauma"],"nxLow":"atA","nxHigh":"high","unit":"VTE risk factor","noun":"factor","lowName":"At risk","highName":"High risk","lowBadge":"AT RISK","highBadge":"HIGH RISK","suffix":"2 or more = High risk","zeroLbl":"None selected — Continue (At risk)"}}
  },ends:{
    "low":{"type":"clr","tag":"Low risk / cleared","title":"LOW RISK","body":"<ul class=\"il\"><li>Encourage ambulation/mobility</li></ul>"},
    "atB":{"type":"ok","tag":"Pathway outcome","title":"AT RISK (baseline mobility, 1 or more risk factors)","body":"<ul class=\"il\"><li>Encourage ambulation/mobility</li><li>PT/OT</li></ul>"},
    "atA":{"type":"ok","tag":"Pathway outcome","title":"AT RISK (altered mobility, 0 - 1 risk factors)","body":"<ul class=\"il\"><li>Encourage ambulation/mobility</li><li>PT/OT</li><li>SCD and/or compression stockings (mechanical VTE prophylaxis is indicated for patients &gt; 10 years)</li></ul>"},
    "high":{"type":"esc","tag":"Action required","title":"HIGH RISK (altered mobility, 2 or more risk factors)","body":"<ul class=\"il\"><li>Encourage ambulation/mobility</li><li>PT/OT</li><li>SCD and/or compression stockings (mechanical VTE prophylaxis is indicated for patients &gt; 10 years)</li><li>Anticoagulation prophylaxis (see Pharmacologic Considerations in section 4)</li></ul>"}
  }},
  sbirt:{start:"inc",nodes:{
    "inc":{"q":"Does the patient meet ALL inclusion criteria?","k":"Meets all SBIRT inclusion criteria","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Trauma patient admitted to the hospital</p></details><ul class=\"il\"><li>(1) 12 years of age or older</li><li>(2) Admitted to the hospital due to an injury</li><li>(3) Both mentally competent and sufficiently stable from a medical perspective to answer the questions on the CRAFFT Tool</li></ul>","opts":[{"l":"YES","s":"ok","nx":"intro"},{"l":"No","s":"ok","nx":"G_inc"}]},
    "intro":{"q":"Trauma Services explains the screening and offers the handouts (any time during the admission)","k":"Do this","info":"<ul class=\"il\"><li>Trauma Services identifies the patients who meet inclusion criteria</li><li>At any time during the admission, Trauma Services will:<ul><li>Explain the purpose of the CRAFFT Tool to the patient and any parent or guardian present in the room</li><li>Provide the patient with the Patient Family Education Handout \"Questions and Answers for Adolescents: Screening &amp; Brief Intervention: Alcohol and Substance Abuse\"</li><li>Provide any parent or guardian present with the handout \"Questions and Answers for Parents: Screening &amp; Brief Intervention: Alcohol and Substance Abuse\"</li><li>Verbally request that the parent and/or guardian allow the trauma clinician to have a private conversation with the child</li></ul></li></ul>","opts":[{"l":"Continue","s":"ok","nx":"par"}]},
    "par":{"q":"Does the parent and/or guardian agree to the private conversation and the questions?","k":"Parent/guardian agrees","opts":[{"l":"YES","s":"ok","nx":"open"},{"l":"NO","s":"ok","nx":"refuse"}]},
    "open":{"q":"In a private setting, ask the adolescent to be honest (\"Please answer these next questions honestly\"), then ask the 3 opening questions. During the past 12 months, did you: (1) drink any alcohol (more than a few sips)? (2) smoke any marijuana or hashish? (3) use anything else to get high? Is the answer YES to any one or more?","k":"Any YES to the 3 opening questions","info":"<ul class=\"il\"><li>\"Anything else\" includes illegal drugs, over the counter prescription drugs, and things that you sniff or \"huff\"</li></ul>","opts":[{"l":"YES (any 1 or more)","s":"ok","nx":"all6"},{"l":"NO (all 3 are No)","s":"ok","nx":"car"}]},
    "all6":{"q":"Ask all 6 CRAFFT questions","k":"Do this","info":"<ul class=\"il\"><li>Ask all 6 CRAFFT questions</li><li>Each \"Yes\" is scored 1 point</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"score"}]},
    "car":{"q":"Ask the CAR question only","k":"Do this","info":"<ul class=\"il\"><li>Ask only the first CRAFFT question (CAR): \"Have you ever ridden in a CAR driven by someone (including yourself) who was high or had been using alcohol or drugs?\"</li><li>A \"Yes\" is scored 1 point</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"score"}]},
    "score":{"q":"Score the CRAFFT Tool (each \"Yes\" = 1 point). What is the result?","k":"CRAFFT score and reported use","info":"<p>A \"positive screen\" is either (1) a \"yes\" response to any two of the questions on the CRAFFT Tool, or (2) a positive urine or serum alcohol or drug screen. A positive urine or serum screen is also a positive screen even if the CRAFFT score is lower; the policy does not draw this as a separate arrow.</p>","opts":[{"l":"Score 0 and no reported use of alcohol or drugs","s":"ok","nx":"praise"},{"l":"Score 0 or 1 and any reported use of alcohol or drugs","s":"ok","nx":"brief"},{"l":"Score of 2 or greater","s":"ok","nx":"pos"}]}
  },ends:{
    "G_inc":{"type":"ok","tag":"Not specified","title":"The source does not say what to do here","body":"<p>The policy gives no \"No\" branch, so what to do for a patient who does not meet all inclusion criteria is not specified (the policy simply applies to patients who meet them).</p>"},
    "refuse":{"type":"ok","tag":"Pathway outcome","title":"Comply with the parent/guardian's wishes","body":"<ul class=\"il\"><li>The parent and/or guardian may refuse to leave the room or may refuse the questions altogether. The clinician will comply with the parent and/or guardian's wishes</li><li>Document the decision by the patient and/or parent not to participate in the CRAFFT screening or Brief Intervention in the medical record</li></ul>"},
    "praise":{"type":"clr","tag":"Low risk / cleared","title":"Praise and encouragement","body":"<ul class=\"il\"><li>Adolescents who report no use of alcohol or drugs and have a CRAFFT score of 0 should receive praise and encouragement</li></ul>"},
    "brief":{"type":"ok","tag":"Pathway outcome","title":"Encourage to stop and give brief advice on the adverse health effects of substance use (this is a \"Brief Intervention\")","body":"<ul class=\"il\"><li>Those who receive a score of 0 or 1 and report any use of alcohol or drugs should be encouraged to stop and receive brief advice regarding the adverse health effects of substance use</li></ul>"},
    "pos":{"type":"esc","tag":"Action required","title":"POSITIVE SCREEN: Brief Intervention and referral to Psychiatry","body":"<ul class=\"il\"><li>A score of 2 or greater is a \"positive\" screen: the adolescent is at high risk for having an alcohol or drug-related disorder and requires further assessment</li><li>Any patient who has a positive screen will receive a clinically appropriate Brief Intervention and a referral to Psychiatry</li><li>Psychiatry should be consulted for the patient</li><li>A qualified health care professional will provide referrals for therapy/treatment for those patients who need and want more intensive, preventative therapy</li><li>Substance abuse resources should be provided to the patient and parent unless contraindicated under the confidentiality section</li><li>Trauma Services notifies psychiatry of a positive screen</li></ul>"}
  }},
  nat:{start:"hr",nodes:{
    "hr":{"q":"Does the patient have a high risk injury¹ or multiple red flags?","k":"High risk injury or multiple red flags","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Patient presents to the Emergency Department or Urgent Care with a possible high-risk injury</p></details><ul class=\"il\"><li><b>High risk injuries¹:</b> (1) skull/facial fracture in child &lt; 2 years or nonverbal child; (2) long bone fracture in child &lt; 2 years or nonverbal child; (3) intracranial injury in child &lt; 2 years or nonverbal child at any age (exclude MVC); (4) rib fracture in child &lt; 3 years or nonverbal child at any age; (5) patterned and/or symmetrical burns; (6) domestic violence in the home or presents as victim of domestic violence; (7) injuries as defined by TEN-4-FACESp</li><li>Multiple red flags may include multiple concerns this admission or single concerns during multiple admissions (review EPIC FYI)</li></ul>","opts":[{"l":"YES","s":"ok","nx":"which"},{"l":"NO","s":"ok","nx":"disp1"}]},
    "which":{"q":"Which high-risk injury is present?","k":"Which high risk injury","opts":[{"l":"Skull/facial fracture in child < 2 years or nonverbal child (item 1)","s":"ok","nx":"lowS"},{"l":"Long bone fracture in child < 2 years or nonverbal child (item 2)","s":"ok","nx":"lowL"},{"l":"Any other high-risk injury (items 3–7) or multiple red flags","s":"ok","nx":"work"}]},
    "lowS":{"q":"Does the child meet ALL of the following criteria?","k":"All low-risk skull/facial fracture criteria met","info":"<ul class=\"il\"><li>a. Low risk fracture (simple, linear nature, parietal bone)</li><li>b. A reliable history of a fall from a height that can be corroborated by an adult/older child who was present during the incident. This may include an auditory account (e.g., heard a thud and found the child on the ground after being on an elevated surface)</li><li>c. The child is 6 months old and mobile</li><li>d. There are no additional fractures</li></ul>","opts":[{"l":"YES (all met)","s":"ok","nx":"dcS"},{"l":"NO (not all met)","s":"ok","nx":"work"}]},
    "lowL":{"q":"Does the child meet ALL of the following criteria?","k":"All low-risk long bone fracture criteria met","info":"<ul class=\"il\"><li>a. &gt; 9 months old</li><li>b. Patient is cruising or walking</li><li>c. Low risk fracture (distal radius/ulna buckle fracture or a toddler fracture of the tibia)</li><li>d. There are no additional fractures</li></ul>","opts":[{"l":"YES (all met)","s":"ok","nx":"dcL"},{"l":"NO (not all met)","s":"ok","nx":"work"}]},
    "work":{"q":"Proceed with the NAT work up: diagnostic trauma labs, diagnostic trauma imaging and consults","k":"Do this","info":"<ul class=\"il\"><li><b>Diagnostic Trauma Labs</b><ul><li>CBC</li><li>CMP</li><li>Lipase</li><li>If altered mental status, consider urine drug screen (UDS)</li></ul></li><li><b>Diagnostic Trauma Imaging</b><ul><li>Perform photo documentation in Epic if cutaneous findings</li><li>Head CT if patient is &lt; 6 months or neurological findings</li><li>Skeletal Survey &lt; 2 years</li><li>CT abdomen/pelvis with IV contrast if: AST/ALT &gt; 80; elevated lipase; significant concern for abdominal pain, tenderness, or bruising</li><li>In cardiac death with unknown etiology, obtain a post-mortem skeletal survey &lt; 2 years of age</li></ul></li><li><b>Consults</b><ul><li>Consult specialty teams as needed to treat the patient's specific injury</li><li>Consult Child Advocacy attending or fellow on call if there are questions surrounding evaluation, disposition, questions surrounding red flags/risk factors or equivocal findings</li><li>Consult Social Work (SW) for an assessment. SW to initiate referrals to DFCS and/or Law Enforcement if home safety concerns identified, need for further investigation for injury and/or as indicated by provider</li></ul></li></ul>","opts":[{"l":"Continue","s":"ok","nx":"adm"}]},
    "adm":{"q":"Do findings on history, exam, labs, imaging, or social work evaluation require admission?","k":"Findings require admission","opts":[{"l":"YES","s":"ok","nx":"trauma"},{"l":"NO","s":"ok","nx":"disp2"}]}
  },ends:{
    "disp1":{"type":"ok","tag":"Pathway outcome","title":"Disposition per ED attending/APP","body":""},
    "dcS":{"type":"ok","tag":"Pathway outcome","title":"Consult social work and consider discharge per ED Attending/Neurosurgery","body":""},
    "dcL":{"type":"ok","tag":"Pathway outcome","title":"Consult social work and consider discharge per ED Attending/Orthopedics","body":""},
    "trauma":{"type":"esc","tag":"Action required","title":"Consult/admit to trauma service","body":""},
    "disp2":{"type":"ok","tag":"Pathway outcome","title":"Disposition per ED attending","body":""}
  }},
  csec:{start:"set",nodes:{
    "set":{"q":"Which pathway applies?","k":"Pathway","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Concern for child sex trafficking / commercial sexual exploitation in a patient 11 years or older</p></details>","opts":[{"l":"Emergency Department","s":"ok","nx":"ed1"},{"l":"Urgent and Primary Care","s":"ok","nx":"uc1"},{"l":"Inpatient","s":"ok","nx":"ip1"},{"l":"Considering prophylactic treatment (STI, HIV, pregnancy)","s":"ok","nx":"pro1"}]},
    "ed1":{"q":"ED: Does the Provider/Nurse have concerns of CST based on risk factors¹?","k":"ED: concerns of CST based on risk factors","info":"<ul class=\"il\"><li>¹ Risk factors for CST ≥ 11 years:<ul><li><b>Chief complaint of:</b> vaginal or penile discharge (or noted on exam); request for STI testing; request for pregnancy testing; intoxication or ingestion; suicide attempt; clearance exam for DFCS; acute sexual assault</li><li><b>Other:</b> child has an injury suspicious for being inflicted; child has a history of running away; staff has any other concerns of CST</li></ul></li></ul>","opts":[{"l":"YES","s":"ok","nx":"ed2"},{"l":"NO","s":"ok","nx":"rout"}]},
    "ed2":{"q":"ED: Provider/Nurse consults Social Work","k":"Do this","info":"<ul class=\"il\"><li>Provider/Nurse consults Social Work</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ed3"}]},
    "ed3":{"q":"ED: Social Work uses the Short Screen for CST","k":"Do this","info":"<ul class=\"il\"><li>Social Work uses the Short Screen for CST</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ed4"}]},
    "ed4":{"q":"ED: Social Worker discusses the case with the attending","k":"Do this","info":"<ul class=\"il\"><li>Social Worker discusses the case with the attending</li><li>² If considering prophylactic treatment, see the prophylaxis pathway (STI, HIV, &amp; Pregnancy)</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ed5"}]},
    "ed5":{"q":"ED: Is there concern for CST?²","k":"ED: concern for CST","opts":[{"l":"No","s":"ok","nx":"rout"},{"l":"Yes, but not active CST","s":"ok","nx":"ed6"},{"l":"Yes, active CST","s":"ok","nx":"ed7"}]},
    "ed6":{"q":"ED, concern for CST but not active CST: Is the patient being admitted?","k":"ED: admit (not active CST)","opts":[{"l":"Admit: No","s":"ok","nx":"ed6n"},{"l":"Admit: Yes","s":"ok","nx":"ed6y"}]},
    "ed7":{"q":"ED, active CST: Call CPT Provider for a sexual abuse exam; call law enforcement/DFCS","k":"Do this","info":"<ul class=\"il\"><li>Call CPT Provider for sexual abuse exam</li><li>Call law enforcement/DFCS</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ed8"}]},
    "ed8":{"q":"ED, active CST: Is the patient being admitted?","k":"ED: admit (active CST)","opts":[{"l":"Admit: No","s":"ok","nx":"ed8n"},{"l":"Admit: Yes","s":"ok","nx":"ed8y"}]},
    "uc1":{"q":"UC/Primary Care: A nurse uses the Abuse Screening tool in the Initial Assessment tool OR the provider suspects CST during the visit based on risk factors¹. Is abuse, neglect or CST suspected?","k":"UC/PC: abuse, neglect or CST suspected","info":"<ul class=\"il\"><li>¹ Risk factors for CST ≥ 11 years:<ul><li><b>Chief complaint of:</b> vaginal or penile discharge (or noted on exam); request for STI testing; request for pregnancy testing; intoxication or ingestion; suicide attempt; clearance exam for DFCS; acute sexual assault</li><li><b>Other:</b> child has an injury suspicious for being inflicted; child has a history of running away; staff has any other concerns of CST</li></ul></li><li><b>At any time, local law enforcement may be called if staff feels there is a flight risk or dangerous situation.</b></li></ul>","opts":[{"l":"No","s":"ok","nx":"ucr"},{"l":"Yes","s":"ok","nx":"uc2"}]},
    "uc2":{"q":"UC/PC: Nurse contacts the lead provider and follows the Abuse Algorithm for UC","k":"Do this","info":"<ul class=\"il\"><li>Nurse contacts lead provider and follows the Abuse Algorithm for UC</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"uc3"}]},
    "uc3":{"q":"UC/PC: Call is made to the Transfer Center","k":"Do this","info":"<ul class=\"il\"><li>Call is made to Transfer Center</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"uc4"}]},
    "uc4":{"q":"UC/PC: Transfer Center contacts the provider on call for Stephanie V. Blank","k":"Do this","info":"<ul class=\"il\"><li>Transfer Center will contact provider on call for Stephanie V. Blank</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"uc5"}]},
    "ip1":{"q":"Inpatient trigger: staff concern or Social Work identifies \"high risk\"","k":"Do this","info":"<ul class=\"il\"><li>Staff member(s) concern that the child is a CST victim based on risk factors¹, OR Social Work identifies the patient as \"high risk\"</li><li>¹ Risk factors for CST ≥ 11 years:<ul><li><b>Chief complaint of:</b> vaginal or penile discharge (or noted on exam); request for STI testing; request for pregnancy testing; intoxication or ingestion; suicide attempt; clearance exam for DFCS; acute sexual assault</li><li><b>Other:</b> child has an injury suspicious for being inflicted; child has a history of running away; staff has any other concerns of CST</li></ul></li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ip2"}]},
    "ip2":{"q":"Inpatient: Consult Social Work","k":"Do this","info":"<ul class=\"il\"><li>Consult Social Work</li><li>Social Worker uses the Short Screen for CST</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ip3"}]},
    "ip3":{"q":"Inpatient: Is CST suspected based on the Short Screen?²","k":"Inpatient: CST suspected on Short Screen","info":"<ul class=\"il\"><li>² If considering prophylactic treatment, see the prophylaxis pathway (STI, HIV, &amp; Pregnancy)</li></ul>","opts":[{"l":"No","s":"ok","nx":"ipr"},{"l":"Yes","s":"ok","nx":"ipy"}]},
    "pro1":{"q":"Prophylaxis: Which patient group?","k":"Prophylaxis: patient group","info":"","opts":[{"l":"Pre-pubertal child","s":"ok","nx":"prep"},{"l":"Adolescent female (> Tanner Stage 3)","s":"ok","nx":"pro2"}]},
    "pro2":{"q":"Adolescent female (&gt; Tanner Stage 3): STI post-exposure prophylaxis","k":"Do this","info":"<ul class=\"il\"><li>STI post exposure prophylaxis: Rocephin 500mg IM, Azithromycin 1G PO, Flagyl 2G PO, Ella 30mg PO, Zofran 8mg PO</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"pro3"}]},
    "pro3":{"q":"Adolescent female: HIV post-exposure prophylaxis is based on exposure risk. What is the exposure risk?","k":"HIV exposure risk","info":"<ul class=\"il\"><li><b>Substantial risk for HIV exposure:</b> exposure of vagina, rectum, eye, mouth, or other mucous membrane, nonintact skin, or percutaneous contact, WITH blood, semen, vaginal secretions, rectal secretions, breast milk, or any body fluid that is visibly contaminated with blood, WHEN the source is known to be HIV-infected</li><li><b>Negligible risk for HIV exposure:</b> exposure of vagina, rectum, eye, mouth, or other mucous membrane, nonintact skin, or percutaneous contact, WITH urine, nasal secretions, saliva, sweat, or tears if not visibly contaminated with blood, REGARDLESS of the known or suspected HIV status of the source</li></ul>","opts":[{"l":"Substantial exposure risk","s":"ok","nx":"time"},{"l":"Negligible exposure risk","s":"ok","nx":"npep0"}]},
    "time":{"q":"Substantial exposure risk: how long since the exposure?","k":"Time since exposure","info":"","opts":[{"l":"≤ 72 hours since exposure","s":"ok","nx":"src"},{"l":"≥ 72 hours since exposure","s":"ok","nx":"npep0"}]},
    "src":{"q":"Within 72 hours: what is the HIV status of the source patient?","k":"Source patient HIV status","opts":[{"l":"Source patient known to be HIV positive","s":"ok","nx":"npY"},{"l":"Source patient of unknown HIV status","s":"ok","nx":"npC"}]}

  bat:{start:"b0",nodes:{
    "b0":{"q":"Trauma resuscitation and survey","k":"Do this","info":"<details class=\"entryd\"><summary>When to use this pathway</summary><p>Patient presents with a mechanism of injury or presenting symptom concerning for blunt abdominal trauma. Exclusion criteria: any penetrating trauma.</p></details><ul class=\"il\"><li>Trauma resuscitation (ATLS)</li><li>Primary/secondary survey</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"d1"}]},
    "d1":{"q":"Does the patient have ANY of the following: hemodynamic instability, an abnormal GCS, or an unreliable physical exam (any distracting injuries)?","k":"Unstable or unreliable exam","opts":[{"l":"YES","s":"ok","nx":"b1"},{"l":"NO","s":"ok","nx":"b2"}]},
    "b1":{"q":"Activate Trauma STAT², obtain the Extended Trauma Panel¹, Trauma Surgery determines the next step","k":"Do this","info":"<ul class=\"il\"><li>Activate Trauma STAT² (consult Trauma Surgery)</li><li>Obtain Extended Trauma Panel¹</li><li>Trauma Surgery to determine: abdominal/pelvis CT scan VS exploratory laparotomy VS interventional radiology</li><li><b>Additional lab and imaging orders:</b> C-spine x-ray; abdominal/pelvis CT scans; initiate MTP if hemodynamically unstable; serum pregnancy per system policy</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ct"}]},
    "b2":{"q":"Obtain the Basic Trauma Panel¹, then consider CT scan","k":"Do this","info":"<ul class=\"il\"><li>Obtain Basic Trauma Panel¹</li><li><b>Consider CT scan if the patient has any of the following (per physician discretion):</b> complaint of abdominal pain; gross hematuria (visible blood in urine); abdominal wall tenderness or distension; handlebar or seatbelt sign present; AST &gt; 200; lipase &gt; 400; unexplained or severe anemia (hemoglobin less than 7 g/dl); abnormal chest or pelvic x-ray; consider if the patient has a complex medical history (i.e., sickle cell, cardiac history)</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ct"}]},
    "ct":{"q":"Is a CT scan indicated?","k":"CT scan indicated","opts":[{"l":"NO","s":"ok","nx":"adm"},{"l":"YES","s":"ok","nx":"ctdo"}]},
    "ctdo":{"q":"CT scan (if indicated)","k":"Do this","info":"<ul class=\"il\"><li>Abdominal/pelvis CT scan with IV contrast for patients who meet criteria</li><li>Radiology to report findings to the ED provider (ordering provider)</li><li>Notify the Trauma Service if the CT scan is positive, including any blush/extravasation</li><li><b>Trauma surgery to consult IR for all patients with solid organ injury (≥ grade 3), stable or unstable, with CT that shows blush/extravasation</b></li></ul>","opts":[{"l":"Continue","s":"ok","nx":"ctpos"}]},
    "ctpos":{"q":"Is the CT scan positive?","k":"CT scan positive","opts":[{"l":"NO","s":"ok","nx":"adm"},{"l":"YES (continue to management on page 2)","s":"ok","nx":"ip"}]},
    "ip":{"q":"Inpatient management: Is the CT scan with IV contrast positive?","k":"Positive CT scan with IV contrast","info":"<ul class=\"il\"><li>The chart draws three YES arrows from this question (free air or peritonitis; suspected hollow visceral injury; solid organ injury). A patient may fit more than one.</li></ul>","opts":[{"l":"NO","s":"ok","nx":"adm2"},{"l":"YES: free air or peritonitis","s":"ok","nx":"fa"},{"l":"YES: suspected hollow visceral injury","s":"ok","nx":"hv"},{"l":"YES: solid organ injury","s":"ok","nx":"so"}]},
    "hv":{"q":"Suspected hollow visceral injury: the chart shows a Yes/No split below this box but does not write the question. Which branch applies?","k":"Hollow visceral injury","info":"","opts":[{"l":"Yes","s":"ok","nx":"hvy"},{"l":"No","s":"ok","nx":"hvn"}]},
    "so":{"q":"Solid organ injury: Trauma surgery to consult IR for grade 3 or higher with blush/extravasation","k":"Do this","info":"<ul class=\"il\"><li>Trauma surgery to consult IR for all patients with solid organ injury (≥ grade 3), stable or unstable, with CT that shows blush/extravasation</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"atom"}]},
    "atom":{"q":"Admit to hospital and follow the ATOMAC Guideline","k":"Do this","info":"<ul class=\"il\"><li>Admit to Hospital</li><li>Follow ATOMAC Guideline</li><li>ATOMAC applies to solid organ injury (kidney, liver, spleen) shown by CT scan, or suspected injury</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"bleed"}]},
    "bleed":{"q":"ATOMAC: Is there ongoing or very recent bleeding? (As determined by the surgeon; may include high HR, low BP, delayed cap refill, rising SIPA score)","k":"Ongoing or very recent bleeding","opts":[{"l":"No","s":"ok","nx":"st"},{"l":"Yes","s":"ok","nx":"hypo"}]},
    "st":{"q":"ATOMAC, stable: admit to non-ICU with monitoring","k":"Do this","info":"<ul class=\"il\"><li>Stable:<ul><li>Type and Screen</li><li>Admit to non-ICU</li><li>Vitals q2H x 4, then q4h</li><li>Bedrest overnight</li><li>Hb at 6, 12, and 24 hrs</li></ul></li></ul>","opts":[{"l":"Continue","s":"ok","nx":"sthb"}]},
    "sthb":{"q":"ATOMAC, stable: Is Hb &lt; 7.0 or is the patient symptomatic?","k":"Hb < 7.0 or symptomatic (stable branch)","opts":[{"l":"No","s":"ok","nx":"floor"},{"l":"Yes","s":"ok","nx":"stx"}]},
    "stx":{"q":"ATOMAC, stable branch with Hb &lt; 7.0 or symptomatic: transfuse","k":"Do this","info":"<ul class=\"il\"><li>10-20 ml/kg PRBC</li><li>NPO</li><li>Bedrest additional 24 hrs</li><li>Hb q6h until stable x2</li></ul>","opts":[{"l":"Stabilized","s":"ok","nx":"floor"},{"l":"Continued bleeding","s":"ok","nx":"picu"}]},
    "hypo":{"q":"ATOMAC, hypoperfused","k":"Do this","info":"<ul class=\"il\"><li>10-20 mL/kg PRBC; consider 20 ml/kg LR or NS, if needed, while waiting for blood transfusion</li><li>Consider other causes (tamponade, spinal shock, etc.)</li><li>Consider the Massive Transfusion Protocol</li></ul>","opts":[{"l":"No response to PRBC; no other cause identified","s":"ok","nx":"surg"},{"l":"HR/BP/perfusion stabilize","s":"ok","nx":"ct2"}]},
    "ct2":{"q":"CT if not already done","k":"Do this","info":"<ul class=\"il\"><li>CT if not already done</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"picu"}]},
    "picu":{"q":"Admit to PICU","k":"Do this","info":"<ul class=\"il\"><li>Admit to PICU</li><li>Vitals per ICU routine</li><li>NPO</li><li>Hb q6h</li><li>Bedrest until Hb stable</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"pd"}]},
    "pd":{"q":"PICU: Is Hb &lt; 7.0 or is the patient symptomatic?","k":"Hb < 7.0 or symptomatic (PICU)","opts":[{"l":"No","s":"ok","nx":"pstable"},{"l":"Yes","s":"ok","nx":"ptx"}]},
    "pstable":{"q":"Patient stable","k":"Do this","info":"<ul class=\"il\"><li>Patient stable</li><li>No bleeding for 24 hrs</li><li>Transfer to floor, if not contraindicated by other injuries</li></ul>","opts":[{"l":"Stabilized","s":"ok","nx":"floor"}]},
    "ptx":{"q":"PICU, Hb &lt; 7.0 or symptomatic: transfuse","k":"Do this","info":"<ul class=\"il\"><li>10-20 ml/kg PRBC</li><li>NPO</li><li>Bedrest x 24 hr</li><li>Hb q6h</li></ul>","opts":[{"l":"Hb or vital signs still unstable; > 40 mL/kg PRBC or > 4 units PRBC","s":"ok","nx":"nom"},{"l":"Hb ≥ 7.0; < 4 units PRBC and < 40 mL/kg PRBC","s":"ok","nx":"picu24"}]},
    "picu24":{"q":"PICU until Hb stable for 24 hrs","k":"Do this","info":"<ul class=\"il\"><li>PICU until Hb stable for 24 hrs</li></ul>","opts":[{"l":"Rebleed or continued bleeding","s":"ok","nx":"nom"},{"l":"Hb stable","s":"ok","nx":"lower"}]},
    "lower":{"q":"Hb stable: consider transfer to a lower level of care","k":"Do this","info":"<ul class=\"il\"><li>Hb Stable</li><li>Consider transfer to lower level of care</li></ul>","opts":[{"l":"Continue","s":"ok","nx":"floor"}]},
    "nom":{"q":"Failure of non-operative management (NOM). Which option?","k":"Failure of NOM option","opts":[{"l":"Trauma surgery to consult IR","s":"ok","nx":"nomIR"},{"l":"Surgery","s":"ok","nx":"nomSx"},{"l":"Continued NOM at surgeon discretion","s":"ok","nx":"nomC"}]}
  },ends:{
    "adm":{"type":"ok","tag":"Pathway outcome","title":"Admit to Trauma Service if admission criteria³ are met, OR discharge if discharge criteria⁴ are met","body":"<ul class=\"il\"><li>Admit to Trauma Service if the patient meets admission criteria³ (consult Trauma Surgery)</li><li>If concern for NAT, follow the NAT Guideline</li><li>OR: discharge the patient if they meet discharge criteria⁴</li></ul>"},
    "adm2":{"type":"ok","tag":"Pathway outcome","title":"Admission to Trauma Service for observation per physician discretion (see Admission Criteria³)","body":""},
